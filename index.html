<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BlackBoard | Fikir ve Proje Panosu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .sidebar {
            width: 320px;
            background: #0f1117;
            border-right: 1px solid #1e2a3a;
            display: flex;
            flex-direction: column;
            z-index: 20;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid #1e2f3f;
        }

        .sidebar-header h2 {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .create-buttons {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 1px solid #1e2a3a;
        }

        .create-btn {
            background: #0f2b3f;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            text-align: left;
            font-family: inherit;
            border-left: 3px solid #3b82f6;
        }

        .create-btn:hover {
            background: #1e3a5f;
            color: white;
        }

        .lists-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .list-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .section-label {
            color: #5f7f9e;
            font-size: 0.7rem;
            font-weight: 600;
            padding-left: 8px;
            letter-spacing: 0.5px;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .list-item {
            background: #11161f;
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #1e2a3a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item:hover {
            background: #16212b;
            border-color: #2c4c6e;
        }

        .list-item.active-item {
            background: #0a1a2a;
            border-left: 3px solid #3b82f6;
        }

        .item-name {
            color: #e2e8f0;
            font-size: 0.85rem;
            font-weight: 500;
            word-break: break-word;
            flex: 1;
        }

        .item-badge {
            font-size: 0.65rem;
            background: #1e2a3a;
            padding: 2px 6px;
            border-radius: 20px;
            margin-left: 8px;
            color: #8ba0bc;
        }

        .delete-item {
            background: none;
            border: none;
            color: #7f8c9a;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
            border-radius: 6px;
            opacity: 0.6;
        }

        .delete-item:hover {
            background: #b91c1c30;
            color: #f87171;
            opacity: 1;
        }

        .empty-message {
            color: #5a6e85;
            font-size: 0.75rem;
            padding: 12px;
            text-align: center;
        }

        .trash-section {
            margin-top: 16px;
            border-top: 1px solid #1e2a3a;
            padding-top: 16px;
        }

        .trash-btn {
            background: #1a1118;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #c08484;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
        }

        .trash-btn:hover {
            background: #2a1a22;
            color: #ffaaaa;
        }

        .main-board {
            flex: 1;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .board-header {
            padding: 16px 28px;
            background: rgba(10, 10, 15, 0.95);
            border-bottom: 1px solid #1f2c38;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .active-info h3 {
            color: #f1f5f9;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .module-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
            align-items: center;
        }

        .module-tab {
            background: #11161f;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            color: #a0b3d0;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .module-tab:hover {
            background: #1e2a3a;
            color: white;
        }

        .module-tab.active-tab {
            background: #1e3a5f;
            color: white;
        }

        .delete-module-btn {
            background: none;
            border: none;
            color: #7f8c9a;
            cursor: pointer;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 12px;
            opacity: 0.7;
        }

        .delete-module-btn:hover {
            background: #b91c1c30;
            color: #f87171;
            opacity: 1;
        }

        .add-module-btn {
            background: #0f2b3f;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            color: #7ab7ef;
            font-size: 0.7rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .board-actions {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            background: #11161f;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .action-btn:hover {
            background: #1e3a5f;
        }

        .whiteboard-canvas {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 10% 20%, #0f121a, #050508);
            background-image: linear-gradient(rgba(59,130,246,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(59,130,246,0.05) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        .notes-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .idea-card {
            position: absolute;
            min-width: 200px;
            max-width: 280px;
            background: #141a24;
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            cursor: grab;
            border: 1px solid rgba(59,130,246,0.3);
        }

        .idea-card:active { cursor: grabbing; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .drag-area { cursor: grab; color: #5a6e8a; font-size: 14px; padding: 0 4px; }
        .card-title {
            font-weight: 600;
            font-size: 0.85rem;
            background: transparent;
            border: none;
            color: #f0f4fe;
            width: 65%;
            padding: 4px 0;
            font-family: inherit;
            border-bottom: 1px dashed #2c4c6e;
        }
        .card-title:focus { outline: none; border-bottom-color: #3b82f6; }
        .card-content {
            font-size: 0.75rem;
            color: #cbd5e6;
            background: #0f131c;
            border: none;
            width: 100%;
            resize: vertical;
            border-radius: 12px;
            padding: 8px;
            margin-top: 6px;
            font-family: inherit;
        }
        .card-content:focus { outline: none; background: #1a2230; }
        .delete-card {
            background: #2a1a22;
            border: none;
            color: #f08b8b;
            width: 24px;
            height: 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-card:hover { background: #b91c1c; color: white; }
        .color-selector {
            margin-top: 8px;
            display: flex;
            gap: 6px;
            justify-content: flex-end;
            border-top: 1px solid #1e2a3a;
            padding-top: 8px;
        }
        .color-option {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293bc9;
            backdrop-filter: blur(12px);
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            z-index: 200;
            pointer-events: none;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-container {
            background: #11161f;
            border-radius: 20px;
            width: 400px;
            max-width: 90%;
            padding: 24px;
            border: 1px solid #2c4c6e;
        }
        .modal-container h3 { color: white; margin-bottom: 16px; font-size: 1.2rem; }
        .modal-input {
            width: 100%;
            padding: 10px 14px;
            background: #0a0c12;
            border: 1px solid #2c4c6e;
            border-radius: 10px;
            color: white;
            margin-bottom: 20px;
            outline: none;
        }
        .modal-input:focus { border-color: #3b82f6; }
        .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; }
        .modal-btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }
        .modal-btn-cancel { background: #1e2a3a; color: #cbd5e6; }
        .modal-btn-confirm { background: #3b82f6; color: white; }
        .modal-btn-danger { background: #b91c1c; color: white; }

        .trash-list { max-height: 350px; overflow-y: auto; margin: 16px 0; }
        .trash-item {
            background: #0a0c12;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 1px solid #1e2a3a;
        }
        .trash-item.selected { background: #0f2b3f; border-color: #3b82f6; }
        .trash-checkbox { width: 16px; height: 16px; accent-color: #3b82f6; cursor: pointer; }
        .trash-info { flex: 1; }
        .trash-name { font-weight: 500; font-size: 0.8rem; }
        .trash-meta { font-size: 0.65rem; color: #7a8aa5; margin-top: 2px; }
        .trash-badge { background: #1e2a3a; padding: 2px 6px; border-radius: 12px; font-size: 0.6rem; }
        .empty-trash { text-align: center; padding: 40px; color: #5a6e85; }

        .lists-container::-webkit-scrollbar { width: 4px; }
        .lists-container::-webkit-scrollbar-track { background: #0a0c12; }
        .lists-container::-webkit-scrollbar-thumb { background: #2c5270; }
    </style>
</head>
<body>
<div class="app-layout">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>BlackBoard</h2>
        </div>
        <div class="create-buttons">
            <button class="create-btn" id="AddFikirBtn">+ Fikir Ekle</button>
            <button class="create-btn" id="AddProjeBtn">+ Proje Ekle</button>
        </div>
        <div class="lists-container">
            <div class="list-section">
                <div class="section-label">FİKİRLER</div>
                <div class="items-list" id="fikirlerList"></div>
            </div>
            <div class="list-section">
                <div class="section-label">PROJELER</div>
                <div class="items-list" id="projelerList"></div>
            </div>
            <div class="trash-section">
                <button class="trash-btn" id="TrashBinBtn">Çöp Kutusu</button>
            </div>
        </div>
    </div>

    <div class="main-board">
        <div class="board-header">
            <div class="active-info">
                <h3 id="ActiveTitle">Ana Pano</h3>
                <div id="ModuleTabsContainer" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px;"></div>
            </div>
            <div class="board-actions">
                <button class="action-btn" id="AddNoteToActiveBtn">+ Not Ekle</button>
            </div>
        </div>
        <div class="whiteboard-canvas">
            <div class="notes-container" id="NotesContainer">
                <div style="color:#5a6e85; text-align:center; margin-top:80px;">Bir fikir veya proje seçin</div>
            </div>
        </div>
    </div>
</div>
<div id="ToastMsg" class="toast-msg" style="opacity:0;"></div>

<script>
    // ---------- INDEXEDDB ----------
    const DB_NAME = 'BlackBoardDB';
    const DB_VERSION = 3;
    const STORE_NAME = 'appData';
    
    let db = null;
    
    let fikirler = [];
    let projeler = [];
    let aktifTip = null;
    let aktifId = null;
    let aktifModulId = null;
    let trashBin = [];
    
    let nextFikirId = 1;
    let nextProjeId = 1;
    let nextModulId = 1;
    let nextNoteId = 100;
    let nextTrashId = 1;
    
    const colorPalette = ["#1e293b", "#2d1b36", "#1a2e3a", "#2a2a35", "#1e3a4d", "#2c2a3e", "#1f3a3f"];
    
    const fikirlerListDiv = document.getElementById('fikirlerList');
    const projelerListDiv = document.getElementById('projelerList');
    const notesContainer = document.getElementById('NotesContainer');
    const activeTitleSpan = document.getElementById('ActiveTitle');
    const moduleTabsContainer = document.getElementById('ModuleTabsContainer');
    const toastEl = document.getElementById('ToastMsg');
    
    function ShowToast(msg, duration = 1500) {
        toastEl.style.opacity = '1';
        toastEl.innerText = msg.charAt(0).toUpperCase() + msg.slice(1);
        setTimeout(() => { toastEl.style.opacity = '0'; }, duration);
    }
    
    function GetRandomPosition() {
        const rect = notesContainer.getBoundingClientRect();
        const w = rect.width || 900, h = rect.height || 500;
        return { left: Math.min(Math.max(30 + Math.random() * (w - 260), 20), w - 220), top: Math.min(Math.max(30 + Math.random() * (h - 200), 20), h - 160) };
    }
    
    function InitDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onerror = () => reject(req.error);
            req.onsuccess = () => { db = req.result; resolve(); };
            req.onupgradeneeded = (e) => { if (!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME); };
        });
    }
    
    async function SaveToDB() {
        if (!db) return;
        const data = { fikirler, projeler, aktifTip, aktifId, aktifModulId, trashBin, nextFikirId, nextProjeId, nextModulId, nextNoteId, nextTrashId };
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(data, 'mainData');
        return tx.complete;
    }
    
    async function LoadFromDB() {
        if (!db) return false;
        const tx = db.transaction(STORE_NAME, 'readonly');
        return new Promise((resolve) => {
            const req = tx.objectStore(STORE_NAME).get('mainData');
            req.onsuccess = () => {
                const data = req.result;
                if (data) {
                    fikirler = data.fikirler || [];
                    projeler = data.projeler || [];
                    aktifTip = data.aktifTip || null;
                    aktifId = data.aktifId || null;
                    aktifModulId = data.aktifModulId || null;
                    trashBin = data.trashBin || [];
                    nextFikirId = data.nextFikirId || 1;
                    nextProjeId = data.nextProjeId || 1;
                    nextModulId = data.nextModulId || 1;
                    nextNoteId = data.nextNoteId || 100;
                    nextTrashId = data.nextTrashId || 1;
                } else CreateInitialData();
                resolve(true);
            };
            req.onerror = () => { CreateInitialData(); resolve(true); };
        });
    }
    
    function CreateInitialData() {
        fikirler = [{ id: nextFikirId++, name: "Mobil Uygulama", notes: [{ id: nextNoteId++, title: "Ana Özellik", content: "Kullanıcı dostu arayüz", left: 100, top: 80, bgColor: "#1e293b" }] }];
        const modul1 = { id: nextModulId++, name: "Ana Modül", notes: [{ id: nextNoteId++, title: "Başlangıç", content: "Proje notları burada", left: 200, top: 120, bgColor: "#1e293b" }] };
        const modul2 = { id: nextModulId++, name: "Algoritmalar", notes: [{ id: nextNoteId++, title: "Drone Algoritması", content: "PID kontrol, sensör füzyonu", left: 400, top: 160, bgColor: "#1e3a4d" }] };
        projeler = [{ id: nextProjeId++, name: "Drone Projesi", modules: [modul1, modul2] }];
        aktifTip = 'fikir';
        aktifId = fikirler[0].id;
        aktifModulId = null;
    }
    
    function ShowModal(title, placeholder, onConfirm, defaultValue = "") {
        const modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-container"><h3>${title}</h3><input type="text" class="modal-input" id="ModalInput" placeholder="${placeholder}" value="${defaultValue.replace(/"/g, '&quot;')}"><div class="modal-buttons"><button class="modal-btn modal-btn-cancel" id="ModalCancel">İptal</button><button class="modal-btn modal-btn-confirm" id="ModalConfirm">Ekle</button></div></div>`;
        document.body.appendChild(modal);
        const input = modal.querySelector('#ModalInput');
        input.focus();
        const close = () => modal.remove();
        modal.querySelector('#ModalCancel').onclick = close;
        modal.querySelector('#ModalConfirm').onclick = () => { const val = input.value.trim(); if (val) onConfirm(val); close(); };
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') modal.querySelector('#ModalConfirm').click(); });
    }
    
    // FİKİR İŞLEMLERİ
    function AddNewFikir() {
        ShowModal('Yeni Fikir', 'Fikir adı...', (name) => {
            const yeniFikir = { id: nextFikirId++, name: name, notes: [] };
            fikirler.push(yeniFikir);
            RenderSidebar();
            SetActiveFikir(yeniFikir.id);
            SaveToDB();
            ShowToast(`"${name}" fikri eklendi`);
        });
    }
    
    function SetActiveFikir(fikirId) {
        const f = fikirler.find(fk => fk.id === fikirId);
        if (!f) return;
        aktifTip = 'fikir';
        aktifId = fikirId;
        aktifModulId = null;
        activeTitleSpan.innerText = f.name;
        moduleTabsContainer.innerHTML = '';
        RenderSidebar();
        RenderBoard();
        SaveToDB();
    }
    
    function DeleteFikir(id) {
        const index = fikirler.findIndex(f => f.id === id);
        if (index !== -1) {
            const f = fikirler[index];
            f.notes.forEach(note => {
                trashBin.push({ id: nextTrashId++, type: 'not', name: note.title, parentName: f.name, deletedAt: new Date().toISOString() });
            });
            trashBin.push({ id: nextTrashId++, type: 'fikir', name: f.name, parentName: 'Genel', deletedAt: new Date().toISOString() });
            fikirler.splice(index, 1);
            if (aktifTip === 'fikir' && aktifId === id) {
                if (fikirler.length > 0) SetActiveFikir(fikirler[0].id);
                else if (projeler.length > 0) SetActiveProje(projeler[0].id);
                else { aktifTip = null; aktifId = null; activeTitleSpan.innerText = "Ana Pano"; moduleTabsContainer.innerHTML = ''; RenderBoard(); }
            }
            RenderSidebar(); SaveToDB(); ShowToast(`"${f.name}" fikri ve notları çöp kutusuna taşındı`);
        }
    }
    
    // PROJE İŞLEMLERİ
    function AddNewProje() {
        ShowModal('Yeni Proje', 'Proje adı...', (name) => {
            const yeniProje = { id: nextProjeId++, name: name, modules: [] };
            projeler.push(yeniProje);
            RenderSidebar();
            SetActiveProje(yeniProje.id);
            SaveToDB();
            ShowToast(`"${name}" projesi eklendi`);
        });
    }
    
    function AddNewModule() {
        const proje = projeler.find(p => p.id === aktifId);
        if (!proje && aktifTip === 'proje') { ShowToast("Önce bir proje seçin", 1000); return; }
        if (aktifTip !== 'proje') { ShowToast("Modül eklemek için bir proje seçin", 1000); return; }
        ShowModal('Yeni Modül', 'Modül adı (örn: algoritmalar, tasarım)...', (name) => {
            const yeniModul = { id: nextModulId++, name: name, notes: [] };
            proje.modules.push(yeniModul);
            SetActiveModul(yeniModul.id);
            RenderModuleTabs();
            RenderBoard();
            SaveToDB();
            ShowToast(`"${name}" modülü eklendi`);
        });
    }
    
    function DeleteModule(modulId) {
        const proje = projeler.find(p => p.id === aktifId);
        if (!proje) return;
        const modulIndex = proje.modules.findIndex(m => m.id === modulId);
        if (modulIndex !== -1) {
            const modul = proje.modules[modulIndex];
            modul.notes.forEach(note => {
                trashBin.push({ id: nextTrashId++, type: 'not', name: note.title, parentName: `${proje.name} / ${modul.name}`, deletedAt: new Date().toISOString() });
            });
            trashBin.push({ id: nextTrashId++, type: 'modul', name: modul.name, parentName: proje.name, deletedAt: new Date().toISOString() });
            proje.modules.splice(modulIndex, 1);
            if (aktifModulId === modulId) {
                if (proje.modules.length > 0) SetActiveModul(proje.modules[0].id);
                else { aktifModulId = null; RenderModuleTabs(); RenderBoard(); }
            }
            RenderModuleTabs();
            RenderBoard();
            SaveToDB();
            ShowToast(`"${modul.name}" modülü ve notları çöp kutusuna taşındı`);
        }
    }
    
    function SetActiveProje(projeId) {
        const proje = projeler.find(p => p.id === projeId);
        if (!proje) return;
        aktifTip = 'proje';
        aktifId = projeId;
        activeTitleSpan.innerText = proje.name;
        if (proje.modules.length > 0) {
            const mevcutModul = proje.modules.find(m => m.id === aktifModulId);
            if (mevcutModul) aktifModulId = mevcutModul.id;
            else aktifModulId = proje.modules[0].id;
        } else {
            aktifModulId = null;
        }
        RenderSidebar();
        RenderModuleTabs();
        RenderBoard();
        SaveToDB();
    }
    
    function SetActiveModul(modulId) {
        aktifModulId = modulId;
        RenderModuleTabs();
        RenderBoard();
        SaveToDB();
    }
    
    function DeleteProje(id) {
        const index = projeler.findIndex(p => p.id === id);
        if (index !== -1) {
            const p = projeler[index];
            p.modules.forEach(modul => {
                modul.notes.forEach(note => {
                    trashBin.push({ id: nextTrashId++, type: 'not', name: note.title, parentName: `${p.name} / ${modul.name}`, deletedAt: new Date().toISOString() });
                });
                trashBin.push({ id: nextTrashId++, type: 'modul', name: modul.name, parentName: p.name, deletedAt: new Date().toISOString() });
            });
            trashBin.push({ id: nextTrashId++, type: 'proje', name: p.name, parentName: 'Genel', deletedAt: new Date().toISOString() });
            projeler.splice(index, 1);
            if (aktifTip === 'proje' && aktifId === id) {
                if (projeler.length > 0) SetActiveProje(projeler[0].id);
                else if (fikirler.length > 0) SetActiveFikir(fikirler[0].id);
                else { aktifTip = null; aktifId = null; aktifModulId = null; activeTitleSpan.innerText = "Ana Pano"; moduleTabsContainer.innerHTML = ''; RenderBoard(); }
            }
            RenderSidebar(); SaveToDB(); ShowToast(`"${p.name}" projesi ve tüm modülleri çöp kutusuna taşındı`);
        }
    }
    
    // ORTAK NOT İŞLEMLERİ
    function GetCurrentNotes() {
        if (aktifTip === 'fikir') {
            const f = fikirler.find(fk => fk.id === aktifId);
            return f ? f.notes : [];
        } else if (aktifTip === 'proje') {
            const proje = projeler.find(p => p.id === aktifId);
            if (!proje || !aktifModulId) return [];
            const modul = proje.modules.find(m => m.id === aktifModulId);
            return modul ? modul.notes : [];
        }
        return [];
    }
    
    function AddNoteToActive() {
        if (!aktifTip || !aktifId) { ShowToast("Önce bir fikir veya proje seçin", 1200); return; }
        const { left, top } = GetRandomPosition();
        const yeniNote = { id: nextNoteId++, title: "Yeni not", content: "Detaylar...", left, top, bgColor: "#1e293b" };
        
        if (aktifTip === 'fikir') {
            const f = fikirler.find(fk => fk.id === aktifId);
            if (f) f.notes.push(yeniNote);
        } else if (aktifTip === 'proje') {
            const proje = projeler.find(p => p.id === aktifId);
            if (proje && aktifModulId) {
                const modul = proje.modules.find(m => m.id === aktifModulId);
                if (modul) modul.notes.push(yeniNote);
                else { ShowToast("Önce bir modül seçin", 1000); return; }
            }
        }
        RenderBoard(); SaveToDB(); ShowToast("Not eklendi", 1000);
    }
    
    function DeleteNote(noteId) {
        if (aktifTip === 'fikir') {
            const f = fikirler.find(fk => fk.id === aktifId);
            if (f) {
                const index = f.notes.findIndex(n => n.id === noteId);
                if (index !== -1) {
                    const removed = f.notes.splice(index, 1)[0];
                    trashBin.push({ id: nextTrashId++, type: 'not', name: removed.title, parentName: f.name, deletedAt: new Date().toISOString() });
                    RenderBoard(); SaveToDB(); ShowToast("Not çöp kutusuna taşındı", 1000);
                }
            }
        } else if (aktifTip === 'proje') {
            const proje = projeler.find(p => p.id === aktifId);
            if (proje && aktifModulId) {
                const modul = proje.modules.find(m => m.id === aktifModulId);
                if (modul) {
                    const index = modul.notes.findIndex(n => n.id === noteId);
                    if (index !== -1) {
                        const removed = modul.notes.splice(index, 1)[0];
                        trashBin.push({ id: nextTrashId++, type: 'not', name: removed.title, parentName: `${proje.name} / ${modul.name}`, deletedAt: new Date().toISOString() });
                        RenderBoard(); SaveToDB(); ShowToast("Not çöp kutusuna taşındı", 1000);
                    }
                }
            }
        }
    }
    
    // RENDER FONKSİYONLARI
    function RenderSidebar() {
        fikirlerListDiv.innerHTML = '';
        if (fikirler.length === 0) {
            const empty = document.createElement('div'); empty.className = 'empty-message'; empty.innerText = 'Henüz fikir yok';
            fikirlerListDiv.appendChild(empty);
        } else {
            fikirler.forEach(f => {
                const div = document.createElement('div'); div.className = 'list-item';
                if (aktifTip === 'fikir' && aktifId === f.id) div.classList.add('active-item');
                div.innerHTML = `<span class="item-name">${EscapeHtml(f.name)} <span class="item-badge">${f.notes.length} not</span></span><button class="delete-item" data-id="${f.id}">sil</button>`;
                div.addEventListener('click', (e) => { if (!e.target.classList.contains('delete-item')) SetActiveFikir(f.id); });
                div.querySelector('.delete-item').addEventListener('click', (e) => { e.stopPropagation(); DeleteFikir(f.id); });
                fikirlerListDiv.appendChild(div);
            });
        }
        
        projelerListDiv.innerHTML = '';
        if (projeler.length === 0) {
            const empty = document.createElement('div'); empty.className = 'empty-message'; empty.innerText = 'Henüz proje yok';
            projelerListDiv.appendChild(empty);
        } else {
            projeler.forEach(p => {
                const div = document.createElement('div'); div.className = 'list-item';
                if (aktifTip === 'proje' && aktifId === p.id) div.classList.add('active-item');
                const toplamNot = p.modules.reduce((acc, m) => acc + m.notes.length, 0);
                div.innerHTML = `<span class="item-name">${EscapeHtml(p.name)} <span class="item-badge">${p.modules.length} modül, ${toplamNot} not</span></span><button class="delete-item" data-id="${p.id}">sil</button>`;
                div.addEventListener('click', (e) => { if (!e.target.classList.contains('delete-item')) SetActiveProje(p.id); });
                div.querySelector('.delete-item').addEventListener('click', (e) => { e.stopPropagation(); DeleteProje(p.id); });
                projelerListDiv.appendChild(div);
            });
        }
    }
    
    function RenderModuleTabs() {
        moduleTabsContainer.innerHTML = '';
        if (aktifTip !== 'proje') return;
        const proje = projeler.find(p => p.id === aktifId);
        if (!proje) return;
        proje.modules.forEach(mod => {
            const btn = document.createElement('button');
            btn.className = 'module-tab';
            if (aktifModulId === mod.id) btn.classList.add('active-tab');
            btn.innerHTML = `${EscapeHtml(mod.name)} <button class="delete-module-btn" data-id="${mod.id}">✕</button>`;
            btn.onclick = (e) => { if (!e.target.classList.contains('delete-module-btn')) SetActiveModul(mod.id); };
            const delBtn = btn.querySelector('.delete-module-btn');
            delBtn.addEventListener('click', (e) => { e.stopPropagation(); DeleteModule(mod.id); });
            moduleTabsContainer.appendChild(btn);
        });
        const addBtn = document.createElement('button');
        addBtn.className = 'add-module-btn';
        addBtn.innerHTML = '+ Modül ekle';
        addBtn.onclick = () => AddNewModule();
        moduleTabsContainer.appendChild(addBtn);
    }
    
    function RenderBoard() {
        notesContainer.innerHTML = '';
        if (!aktifTip || !aktifId) {
            notesContainer.innerHTML = '<div style="color:#5a6e85; text-align:center; margin-top:80px;">Bir fikir veya proje seçin</div>';
            return;
        }
        
        if (aktifTip === 'fikir') {
            const f = fikirler.find(fk => fk.id === aktifId);
            if (!f) { notesContainer.innerHTML = '<div style="color:#5a6e85; text-align:center; margin-top:80px;">Fikir bulunamadı</div>'; return; }
            if (f.notes.length === 0) { notesContainer.innerHTML = '<div style="color:#5a6e85; text-align:center; margin-top:80px;">Not eklemek için "+ Not Ekle" butonuna tıklayın</div>'; return; }
            f.notes.forEach(note => RenderNoteCard(note));
        } else if (aktifTip === 'proje') {
            const proje = projeler.find(p => p.id === aktifId);
            if (!proje) { notesContainer.innerHTML = '<div style="color:#5a6e85; text-align:center; margin-top:80px;">Proje bulunamadı</div>'; return; }
            if (!aktifModulId || !proje.modules.find(m => m.id === aktifModulId)) {
                if (proje.modules.length > 0) { aktifModulId = proje.modules[0].id; RenderModuleTabs(); }
                else { notesContainer.innerHTML = '<div style="color:#5a6e85; text-align:center; margin-top:80px;">Modül eklemek için "+ Modül ekle" butonuna tıklayın</div>'; return; }
            }
            const modul = proje.modules.find(m => m.id === aktifModulId);
            if (modul.notes.length === 0) { notesContainer.innerHTML = '<div style="color:#5a6e85; text-align:center; margin-top:80px;">Not eklemek için "+ Not Ekle" butonuna tıklayın</div>'; return; }
            modul.notes.forEach(note => RenderNoteCard(note));
        }
    }
    
    function RenderNoteCard(note) {
        const card = document.createElement('div'); card.className = 'idea-card'; card.setAttribute('data-note-id', note.id);
        card.style.left = note.left + 'px'; card.style.top = note.top + 'px'; card.style.backgroundColor = note.bgColor || "#1e293b";
        card.innerHTML = `<div class="card-header"><span class="drag-area">⋮⋮</span><input type="text" class="card-title" value="${EscapeHtml(note.title)}" placeholder="Başlık"><button class="delete-card">✕</button></div><textarea class="card-content" placeholder="Not detayı...">${EscapeHtml(note.content)}</textarea><div class="color-selector" id="ColorSelector-${note.id}"></div>`;
        const titleInp = card.querySelector('.card-title'); const contentArea = card.querySelector('.card-content'); const delBtn = card.querySelector('.delete-card');
        titleInp.addEventListener('change', () => { note.title = titleInp.value; SaveToDB(); });
        contentArea.addEventListener('change', () => { note.content = contentArea.value; SaveToDB(); });
        delBtn.addEventListener('click', (e) => { e.stopPropagation(); DeleteNote(note.id); });
        const colorDiv = card.querySelector(`#ColorSelector-${note.id}`);
        colorPalette.forEach(color => {
            const dot = document.createElement('div'); dot.className = 'color-option'; dot.style.backgroundColor = color;
            dot.style.border = note.bgColor === color ? '2px solid white' : '1px solid rgba(255,255,255,0.3)';
            dot.addEventListener('click', (e) => { e.stopPropagation(); note.bgColor = color; card.style.backgroundColor = color; colorDiv.querySelectorAll('.color-option').forEach(d => d.style.border = d.style.backgroundColor === color ? '2px solid white' : '1px solid rgba(255,255,255,0.3)'); SaveToDB(); ShowToast("Renk değiştirildi", 800); });
            colorDiv.appendChild(dot);
        });
        card.addEventListener('mousedown', (e) => { if (e.target.classList.contains('delete-card') || e.target.classList.contains('card-title') || e.target.classList.contains('card-content') || e.target.classList.contains('color-option')) return; e.preventDefault(); StartDrag(e, card, note); });
        notesContainer.appendChild(card);
    }
    
    let DragActive = false, DragCard = null, DragNote = null, StartX, StartY, StartLeft, StartTop;
    function StartDrag(e, cardElement, noteObj) {
        const rect = cardElement.getBoundingClientRect(); const containerRect = notesContainer.getBoundingClientRect();
        DragActive = true; DragCard = cardElement; DragNote = noteObj;
        StartX = e.clientX; StartY = e.clientY; StartLeft = rect.left - containerRect.left; StartTop = rect.top - containerRect.top;
        document.body.style.userSelect = 'none'; cardElement.style.cursor = 'grabbing';
        const onMove = (moveEvent) => {
            if (!DragActive) return; moveEvent.preventDefault();
            let dx = moveEvent.clientX - StartX, dy = moveEvent.clientY - StartY;
            let newLeft = StartLeft + dx, newTop = StartTop + dy;
            const parentRect = notesContainer.getBoundingClientRect();
            const maxX = parentRect.width - DragCard.offsetWidth, maxY = parentRect.height - DragCard.offsetHeight;
            newLeft = Math.min(Math.max(newLeft, 5), Math.max(maxX, 5));
            newTop = Math.min(Math.max(newTop, 5), Math.max(maxY, 5));
            DragCard.style.left = newLeft + 'px'; DragCard.style.top = newTop + 'px';
            if (DragNote) { DragNote.left = newLeft; DragNote.top = newTop; }
        };
        const onUp = () => { if (DragActive) { DragActive = false; document.body.style.userSelect = ''; if (DragCard) DragCard.style.cursor = 'grab'; document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); SaveToDB(); } };
        document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
    }
    
    function ShowTrashModal() {
        if (trashBin.length === 0) {
            const modal = document.createElement('div'); modal.className = 'modal-overlay';
            modal.innerHTML = `<div class="modal-container"><h3>Çöp Kutusu</h3><div class="empty-trash">Çöp kutusu boş</div><div class="modal-buttons"><button class="modal-btn modal-btn-cancel" id="CloseModal">Kapat</button></div></div>`;
            document.body.appendChild(modal);
            modal.querySelector('#CloseModal').onclick = () => modal.remove();
            return;
        }
        const modal = document.createElement('div'); modal.className = 'modal-overlay';
        modal.innerHTML = `<div class="modal-container" style="width: 500px;"><h3>Çöp Kutusu</h3><div class="trash-list" id="TrashListModal"></div><div class="modal-buttons" style="justify-content: space-between;"><div><button class="modal-btn modal-btn-cancel" id="SelectAllBtn">Tümünü Seç</button></div><div style="display: flex; gap: 8px;"><button class="modal-btn modal-btn-cancel" id="RestoreSelectedBtn">Geri Yükle</button><button class="modal-btn modal-btn-danger" id="DeleteSelectedBtn">Kalıcı Sil</button><button class="modal-btn modal-btn-cancel" id="CloseTrashBtn">Kapat</button></div></div></div>`;
        document.body.appendChild(modal);
        const listDiv = modal.querySelector('#TrashListModal');
        let selected = new Array(trashBin.length).fill(false);
        function RenderList() {
            listDiv.innerHTML = '';
            trashBin.forEach((item, idx) => {
                const div = document.createElement('div'); div.className = 'trash-item'; if (selected[idx]) div.classList.add('selected');
                div.innerHTML = `<input type="checkbox" class="trash-checkbox" ${selected[idx] ? 'checked' : ''}><div class="trash-info"><div class="trash-name">${EscapeHtml(item.name)}</div><div class="trash-meta"><span class="trash-badge">${item.type}</span> • ${item.parentName} • ${new Date(item.deletedAt).toLocaleDateString()}</div></div>`;
                const chk = div.querySelector('.trash-checkbox');
                chk.onchange = (e) => { selected[idx] = e.target.checked; if (e.target.checked) div.classList.add('selected'); else div.classList.remove('selected'); };
                div.onclick = (e) => { if (e.target !== chk) { chk.checked = !chk.checked; selected[idx] = chk.checked; if (chk.checked) div.classList.add('selected'); else div.classList.remove('selected'); } };
                listDiv.appendChild(div);
            });
        }
        RenderList();
        modal.querySelector('#SelectAllBtn').onclick = () => { selected.fill(true); RenderList(); };
        modal.querySelector('#RestoreSelectedBtn').onclick = () => {
            const indices = selected.map((v, i) => v ? i : -1).filter(i => i !== -1).reverse();
            if (indices.length === 0) { ShowToast("Lütfen öğe seçin", 1000); return; }
            indices.forEach(i => trashBin.splice(i, 1));
            SaveToDB(); modal.remove(); ShowToast(`${indices.length} öğe çöp kutusundan kaldırıldı`, 1500);
        };
        modal.querySelector('#DeleteSelectedBtn').onclick = () => {
            const indices = selected.map((v, i) => v ? i : -1).filter(i => i !== -1).reverse();
            if (indices.length === 0) { ShowToast("Lütfen öğe seçin", 1000); return; }
            if (confirm(`${indices.length} öğeyi kalıcı olarak silmek istiyor musunuz?`)) {
                indices.forEach(i => trashBin.splice(i, 1));
                SaveToDB(); modal.remove(); ShowToast(`${indices.length} öğe kalıcı olarak silindi`, 1500);
            }
        };
        modal.querySelector('#CloseTrashBtn').onclick = () => modal.remove();
    }
    
    function EscapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    document.getElementById('AddFikirBtn').addEventListener('click', AddNewFikir);
    document.getElementById('AddProjeBtn').addEventListener('click', AddNewProje);
    document.getElementById('AddNoteToActiveBtn').addEventListener('click', AddNoteToActive);
    document.getElementById('TrashBinBtn').addEventListener('click', ShowTrashModal);
    
    async function StartApp() { await InitDB(); await LoadFromDB(); RenderSidebar(); RenderModuleTabs(); if (aktifTip === 'fikir' && fikirler.find(f=>f.id===aktifId)) SetActiveFikir(aktifId); else if (aktifTip === 'proje' && projeler.find(p=>p.id===aktifId)) SetActiveProje(aktifId); else if (fikirler.length > 0) SetActiveFikir(fikirler[0].id); else if (projeler.length > 0) SetActiveProje(projeler[0].id); else RenderBoard(); window.addEventListener('resize', () => RenderBoard()); }
    StartApp();
</script>
