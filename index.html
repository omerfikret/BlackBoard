<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BlackBoard</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; user-select:none; }

body {
    background:#0a0a0f;
    font-family:'Segoe UI','Inter',system-ui,-apple-system,sans-serif;
    height:100vh; overflow:hidden;
}

.app-layout { display:flex; height:100vh; width:100%; }

/* ─── SIDEBAR ─── */
.sidebar {
    width:300px; background:#0f1117;
    border-right:1px solid #1e2a3a;
    display:flex; flex-direction:column; z-index:20; flex-shrink:0;
}
.sidebar-header { padding:20px 16px 16px; border-bottom:1px solid #1e2f3f; }
.sidebar-header h2 { color:#fff; font-size:1.4rem; font-weight:600; letter-spacing:-0.3px; }
.save-indicator {
    font-size:0.65rem; margin-top:4px; display:flex; align-items:center; gap:5px; height:16px;
}
.save-dot { width:6px; height:6px; border-radius:50%; background:#22c55e; }
.save-dot.unsaved { background:#f59e0b; animation:pulse 1.5s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.save-text { color:#5f7f9e; font-size:0.65rem; }

.create-buttons { padding:14px 12px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid #1e2a3a; }
.create-btn {
    background:#0f2b3f; border:none; padding:9px 14px; border-radius:10px;
    display:flex; align-items:center; gap:8px; font-size:0.82rem; font-weight:500;
    color:#e2e8f0; cursor:pointer; transition:all 0.2s; width:100%; text-align:left;
    font-family:inherit; border-left:3px solid #3b82f6;
}
.create-btn:hover { background:#1e3a5f; color:#fff; }

.lists-container { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:20px; }
.list-section { display:flex; flex-direction:column; gap:7px; }
.section-label { color:#5f7f9e; font-size:0.68rem; font-weight:600; padding-left:6px; letter-spacing:0.5px; }
.items-list { display:flex; flex-direction:column; gap:5px; }

.list-item {
    background:#11161f; border-radius:10px; padding:9px 11px;
    cursor:pointer; transition:all 0.15s; border:1px solid #1e2a3a;
    display:flex; justify-content:space-between; align-items:flex-start;
}
.list-item:hover { background:#16212b; border-color:#2c4c6e; }
.list-item.active-item { background:#0a1a2a; border-left:3px solid #3b82f6; }

.item-name {
    color:#e2e8f0; font-size:0.82rem; font-weight:500;
    word-break:break-word; flex:1; display:flex; flex-direction:column; gap:3px;
}
.item-badge {
    font-size:0.6rem; background:#1e2a3a; padding:2px 6px;
    border-radius:20px; color:#8ba0bc; display:inline-block; width:fit-content;
}
.item-actions { display:flex; gap:4px; flex-shrink:0; margin-left:6px; }
.item-action-btn {
    background:none; border:none; color:#7f8c9a; cursor:pointer;
    font-size:0.72rem; padding:3px 6px; border-radius:6px; opacity:0.7;
    font-family:inherit; white-space:nowrap;
}
.item-action-btn:hover { background:#1e3a5f; color:#7ab7ef; opacity:1; }
.item-action-btn.danger:hover { background:#b91c1c30; color:#f87171; }

.empty-message { color:#5a6e85; font-size:0.75rem; padding:10px; text-align:center; }

.trash-section { margin-top:12px; border-top:1px solid #1e2a3a; padding-top:12px; }
.trash-btn {
    background:#1a1118; border:none; padding:9px 14px; border-radius:10px;
    display:flex; align-items:center; gap:8px; font-size:0.82rem; font-weight:500;
    color:#c08484; cursor:pointer; width:100%; font-family:inherit;
}
.trash-btn:hover { background:#2a1a22; color:#ffaaaa; }

/* ─── MAIN BOARD ─── */
.main-board { flex:1; background:#0a0a0f; display:flex; flex-direction:column; overflow:hidden; }

.board-header {
    padding:13px 22px;
    background:rgba(10,10,15,0.97);
    border-bottom:1px solid #1f2c38;
    flex-shrink:0;
}
.header-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.active-info h3 { color:#f1f5f9; font-size:1rem; font-weight:500; }

.board-actions { display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
.action-btn {
    background:#11161f; border:none; padding:7px 16px; border-radius:30px;
    color:#e2e8f0; font-weight:500; cursor:pointer; font-size:0.78rem;
    font-family:inherit; transition:all 0.2s; border:1px solid #1e2a3a;
}
.action-btn:hover { background:#1e3a5f; border-color:#3b82f6; }
.action-btn.primary { background:#1e3a5f; border-color:#3b82f6; color:#7ab7ef; }
.action-btn.danger { background:#2a1a1a; border-color:#7f1d1d; color:#f87171; }
.action-btn.warn { background:#2a2010; border-color:#78350f; color:#fbbf24; }

/* Line Editor */
.line-editor-bar {
    background:#0f2b3f; border-radius:10px; padding:7px 14px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-top:8px;
}
.line-editor-label { color:#7ab7ef; font-size:0.72rem; font-weight:600; }
.color-picker-group { display:flex; gap:6px; align-items:center; }
.line-color-option { width:22px; height:22px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:0.1s; }
.line-color-option:hover { transform:scale(1.15); border-color:#fff; }
.stroke-btn { background:#1e2a3a; border:none; padding:3px 10px; border-radius:20px; color:#fff; font-size:0.68rem; cursor:pointer; font-family:inherit; }
.stroke-btn:hover { background:#3b82f6; }
.line-action-btn { background:#2a1a22; border:none; padding:3px 10px; border-radius:20px; color:#f08b8b; font-size:0.68rem; cursor:pointer; font-family:inherit; }
.line-action-btn:hover { background:#b91c1c; color:#fff; }
.close-editor-btn { background:#1e2a3a; border:none; padding:3px 10px; border-radius:20px; color:#a0b3d0; font-size:0.68rem; cursor:pointer; font-family:inherit; margin-left:auto; }
.close-editor-btn:hover { background:#3b82f6; color:#fff; }
.selection-info { color:#60a5fa; font-size:0.68rem; background:#1e3a5f; padding:3px 9px; border-radius:20px; }

/* Module tabs */
.module-tabs { display:flex; gap:7px; flex-wrap:wrap; margin-top:8px; align-items:center; }
.module-tab {
    background:#11161f; border:none; padding:5px 13px; border-radius:20px;
    color:#a0b3d0; font-size:0.73rem; cursor:pointer; transition:0.2s;
    display:inline-flex; align-items:center; gap:7px; font-family:inherit;
}
.module-tab:hover { background:#1e2a3a; color:#fff; }
.module-tab.active-tab { background:#1e3a5f; color:#fff; }
.delete-module-btn {
    background:none; border:none; color:#7f8c9a; cursor:pointer;
    font-size:0.68rem; padding:1px 5px; border-radius:10px; opacity:0.7;
}
.delete-module-btn:hover { background:#b91c1c30; color:#f87171; opacity:1; }
.add-module-btn {
    background:#0f2b3f; border:none; padding:5px 11px; border-radius:20px;
    color:#7ab7ef; font-size:0.7rem; cursor:pointer; display:flex;
    align-items:center; gap:4px; font-family:inherit;
}

/* ─── CANVAS ─── */
.whiteboard-canvas {
    flex:1; position:relative; overflow:hidden;
    background:#070709;
    background-image:linear-gradient(rgba(59,130,246,0.04) 1px,transparent 1px),
                    linear-gradient(90deg,rgba(59,130,246,0.04) 1px,transparent 1px);
    background-size:28px 28px;
    cursor:default;
}
.notes-container { position:relative; width:100%; height:100%; overflow:visible; }
.selection-rect { position:absolute; border:2px solid #3b82f6; background:rgba(59,130,246,0.1); pointer-events:none; z-index:200; display:none; }

/* ─── CARDS ─── */
.idea-card {
    position:absolute; width:260px;
    background:#141a24; border-radius:14px; padding:0;
    box-shadow:0 6px 18px rgba(0,0,0,0.4);
    cursor:grab; border:1px solid rgba(59,130,246,0.25);
    transition:box-shadow 0.2s; z-index:10; overflow:hidden;
}
.idea-card:active { cursor:grabbing; }
.idea-card.selected-card { box-shadow:0 0 0 2px #3b82f6, 0 6px 18px rgba(0,0,0,0.4); z-index:100; }

.card-titlebar {
    display:flex; align-items:center; gap:6px;
    padding:9px 10px 8px; border-bottom:1px solid #1e2a3a;
    background:#101520;
}
.drag-area { cursor:grab; color:#5a6e8a; font-size:13px; padding:0 2px; user-select:none; flex-shrink:0; }
.card-title {
    font-weight:600; font-size:0.82rem; background:transparent; border:none;
    color:#f0f4fe; flex:1; padding:2px 0; font-family:inherit;
    border-bottom:1px dashed transparent;
}
.card-title:focus { outline:none; border-bottom-color:#3b82f6; }
.card-type-badge {
    font-size:0.58rem; background:#1e2a3a; padding:1px 6px;
    border-radius:10px; color:#8ba0bc; flex-shrink:0;
}
.connector-btn {
    cursor:pointer; background:#1e3a5f; width:22px; height:22px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12px; transition:all 0.2s; flex-shrink:0; border:none; color:#7ab7ef;
}
.connector-btn:hover { background:#3b82f6; color:#fff; }
.connector-btn.active-connector { background:#f59e0b; box-shadow:0 0 8px #f59e0b; color:#000; }
.delete-card {
    background:none; border:none; color:#5a6e8a; width:20px; height:20px;
    border-radius:20px; cursor:pointer; font-size:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
}
.delete-card:hover { background:#7f1d1d; color:#fff; }

/* Card body: blocks */
.card-body { padding:8px; display:flex; flex-direction:column; gap:5px; min-height:40px; }

/* Blocks inside card */
.block { position:relative; border-radius:8px; overflow:hidden; }

.block-text textarea {
    width:100%; background:#0f131c; border:none; color:#cbd5e6;
    font-size:0.74rem; font-family:inherit; resize:vertical;
    padding:7px 8px; border-radius:8px; min-height:50px;
    line-height:1.5;
}
.block-text textarea:focus { outline:none; background:#1a2230; }

.block-checklist { background:#0d1520; border-radius:8px; padding:6px 8px; }
.checklist-item {
    display:flex; align-items:flex-start; gap:7px; padding:3px 0;
    border-bottom:1px solid #1e2a3a30;
}
.checklist-item:last-child { border-bottom:none; }
.checklist-cb { width:14px; height:14px; accent-color:#3b82f6; cursor:pointer; margin-top:1px; flex-shrink:0; }
.checklist-label {
    flex:1; font-size:0.73rem; color:#cbd5e6; background:transparent;
    border:none; font-family:inherit; padding:0;
}
.checklist-label:focus { outline:none; }
.checklist-label.done { text-decoration:line-through; color:#5a6e85; }
.checklist-del { background:none; border:none; color:#5a6e85; cursor:pointer; font-size:10px; padding:0 3px; }
.checklist-del:hover { color:#f87171; }
.add-checklist-item {
    width:100%; background:none; border:none; color:#5a6e85; font-size:0.68rem;
    cursor:pointer; text-align:left; padding:4px 2px; font-family:inherit;
    margin-top:2px;
}
.add-checklist-item:hover { color:#7ab7ef; }

.block-steps { background:#0d1520; border-radius:8px; padding:6px 8px; }
.step-item {
    display:flex; align-items:flex-start; gap:8px; padding:4px 0;
    border-bottom:1px solid #1e2a3a30;
}
.step-item:last-child { border-bottom:none; }
.step-num {
    width:18px; height:18px; background:#1e3a5f; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:0.6rem; color:#7ab7ef; font-weight:700; flex-shrink:0; margin-top:1px;
}
.step-text {
    flex:1; font-size:0.73rem; color:#cbd5e6; background:transparent;
    border:none; font-family:inherit; padding:0; resize:none; min-height:20px;
}
.step-text:focus { outline:none; }
.step-del { background:none; border:none; color:#5a6e85; cursor:pointer; font-size:10px; padding:0 3px; }
.step-del:hover { color:#f87171; }
.add-step-item {
    width:100%; background:none; border:none; color:#5a6e85; font-size:0.68rem;
    cursor:pointer; text-align:left; padding:4px 2px; font-family:inherit; margin-top:2px;
}
.add-step-item:hover { color:#7ab7ef; }

.block-code { background:#060a10; border-radius:8px; overflow:hidden; }
.code-lang-bar {
    background:#0f1824; padding:4px 8px; display:flex;
    justify-content:space-between; align-items:center;
}
.code-lang-select {
    background:transparent; border:none; color:#7ab7ef; font-size:0.68rem;
    font-family:inherit; cursor:pointer;
}
.code-copy-btn {
    background:none; border:none; color:#5a6e85; font-size:0.65rem;
    cursor:pointer; font-family:inherit; padding:2px 6px; border-radius:4px;
}
.code-copy-btn:hover { background:#1e3a5f; color:#7ab7ef; }
.block-code textarea {
    width:100%; background:#060a10; border:none; color:#a8d8b8;
    font-size:0.72rem; font-family:'Courier New',monospace; resize:vertical;
    padding:8px; min-height:60px; tab-size:4;
}
.block-code textarea:focus { outline:none; }

.block-link { background:#0d1520; border-radius:8px; padding:7px 9px; }
.link-url-inp {
    width:100%; background:#060a10; border:1px solid #1e2a3a; border-radius:6px;
    color:#60a5fa; font-size:0.72rem; font-family:inherit; padding:5px 8px;
}
.link-url-inp:focus { outline:none; border-color:#3b82f6; }
.link-label-inp {
    width:100%; background:transparent; border:none; border-bottom:1px dashed #1e2a3a;
    color:#cbd5e6; font-size:0.72rem; font-family:inherit; padding:4px 0; margin-top:5px;
}
.link-label-inp:focus { outline:none; border-bottom-color:#3b82f6; }

/* Block add toolbar */
.card-addblock-bar {
    display:flex; gap:5px; padding:6px 8px 4px;
    border-top:1px solid #1e2a3a; flex-wrap:wrap;
}
.addblock-btn {
    background:#1e2a3a; border:none; padding:3px 9px; border-radius:20px;
    color:#8ba0bc; font-size:0.65rem; cursor:pointer; font-family:inherit;
    transition:all 0.15s;
}
.addblock-btn:hover { background:#1e3a5f; color:#7ab7ef; }

/* Block delete */
.block-delete-btn {
    position:absolute; top:4px; right:4px;
    background:none; border:none; color:transparent; cursor:pointer;
    font-size:10px; border-radius:4px; padding:1px 4px; z-index:5;
}
.block:hover .block-delete-btn { color:#5a6e85; }
.block-delete-btn:hover { color:#f87171 !important; background:#2a1a22; }

/* Card footer */
.card-footer { padding:5px 8px 8px; display:flex; justify-content:space-between; align-items:center; }
.color-selector { display:flex; gap:5px; }
.color-option { width:18px; height:18px; border-radius:50%; cursor:pointer; border:1px solid rgba(255,255,255,0.2); }
.expand-card-btn {
    background:none; border:none; color:#5a6e85; font-size:0.68rem;
    cursor:pointer; font-family:inherit; padding:2px 6px; border-radius:6px;
}
.expand-card-btn:hover { background:#1e3a5f; color:#7ab7ef; }

/* ─── CONNECTION POINTS ─── */
.connection-point {
    position:absolute; width:10px; height:10px;
    background:#3b82f6; border-radius:50%; cursor:crosshair;
    transition:all 0.2s; z-index:15; border:2px solid #fff; opacity:0.7;
}
.idea-card:hover .connection-point { opacity:1; }
.connection-point:hover { background:#f59e0b; transform:scale(1.3); opacity:1; }
.connection-point.top { top:-5px; left:50%; transform:translateX(-50%); }
.connection-point.bottom { bottom:-5px; left:50%; transform:translateX(-50%); }
.connection-point.left { left:-5px; top:50%; transform:translateY(-50%); }
.connection-point.right { right:-5px; top:50%; transform:translateY(-50%); }

svg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:6; }
svg line { pointer-events:stroke; }

/* ─── EXPAND MODAL ─── */
.expand-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.88); backdrop-filter:blur(8px);
    z-index:400; display:flex; align-items:center; justify-content:center;
}
.expand-container {
    background:#0f1420; border-radius:16px; width:680px; max-width:95vw;
    max-height:88vh; display:flex; flex-direction:column;
    border:1px solid #2c4c6e; overflow:hidden;
}
.expand-header {
    padding:16px 20px; border-bottom:1px solid #1e2a3a;
    display:flex; align-items:center; gap:12px; background:#101824;
}
.expand-title-inp {
    flex:1; background:transparent; border:none; color:#f0f4fe;
    font-size:1.1rem; font-weight:600; font-family:inherit;
}
.expand-title-inp:focus { outline:none; }
.expand-type { font-size:0.7rem; color:#7ab7ef; background:#1e3a5f; padding:3px 9px; border-radius:20px; }
.expand-close { background:none; border:none; color:#7f8c9a; cursor:pointer; font-size:1.1rem; }
.expand-close:hover { color:#f87171; }
.expand-body { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
.expand-addbar { padding:12px 16px 14px; border-top:1px solid #1e2a3a; display:flex; gap:8px; flex-wrap:wrap; }
.expand-addbar .addblock-btn { font-size:0.72rem; padding:5px 13px; }

/* ─── MODAL ─── */
.modal-overlay {
    position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,0.88); backdrop-filter:blur(6px);
    z-index:300; display:flex; align-items:center; justify-content:center;
}
.modal-container {
    background:#11161f; border-radius:16px; width:420px; max-width:93%;
    padding:22px; border:1px solid #2c4c6e;
}
.modal-container h3 { color:#fff; margin-bottom:14px; font-size:1.1rem; }
.modal-input {
    width:100%; padding:9px 13px; background:#0a0c12; border:1px solid #2c4c6e;
    border-radius:9px; color:#fff; margin-bottom:18px; outline:none; font-family:inherit;
}
.modal-input:focus { border-color:#3b82f6; }
.modal-buttons { display:flex; gap:10px; justify-content:flex-end; }
.modal-btn { padding:7px 16px; border-radius:30px; border:none; cursor:pointer; font-weight:500; font-family:inherit; }
.modal-btn-cancel { background:#1e2a3a; color:#cbd5e6; }
.modal-btn-confirm { background:#3b82f6; color:#fff; }
.modal-btn-danger { background:#b91c1c; color:#fff; }
.modal-btn-warn { background:#d97706; color:#fff; }

/* Trash modal */
.trash-list { max-height:340px; overflow-y:auto; margin:14px 0; display:flex; flex-direction:column; gap:5px; }
.trash-item {
    background:#0a0c12; padding:9px 10px; border-radius:8px;
    display:flex; align-items:center; gap:9px; cursor:pointer;
    border:1px solid #1e2a3a; transition:0.15s;
}
.trash-item:hover { border-color:#2c4c6e; }
.trash-item.selected { background:#0f2b3f; border-color:#3b82f6; }
.trash-checkbox { width:14px; height:14px; accent-color:#3b82f6; cursor:pointer; flex-shrink:0; }
.trash-info { flex:1; }
.trash-name { font-weight:500; font-size:0.78rem; color:#e2e8f0; }
.trash-meta { font-size:0.62rem; color:#7a8aa5; margin-top:2px; display:flex; align-items:center; gap:5px; }
.trash-type-badge {
    padding:1px 6px; border-radius:10px; font-size:0.6rem; font-weight:600;
}
.tb-fikir { background:#1e3a5f; color:#7ab7ef; }
.tb-proje { background:#2a1a4a; color:#c084fc; }
.tb-modul { background:#0f3a2a; color:#34d399; }
.tb-not { background:#1e2a3a; color:#94a3b8; }
.empty-trash { text-align:center; padding:36px; color:#5a6e85; }

/* ─── TOAST ─── */
.toast-msg {
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    background:#1e293bdd; backdrop-filter:blur(12px); color:#fff;
    padding:7px 18px; border-radius:40px; font-size:0.78rem;
    z-index:500; pointer-events:none; transition:opacity 0.3s;
}

/* ─── UNDO INDICATOR ─── */
.undo-hint {
    position:fixed; bottom:66px; left:50%; transform:translateX(-50%);
    background:#0f2b3f; color:#7ab7ef; padding:5px 14px; border-radius:30px;
    font-size:0.7rem; z-index:400; pointer-events:none; opacity:0; transition:opacity 0.3s;
}

.lists-container::-webkit-scrollbar { width:3px; }
.lists-container::-webkit-scrollbar-track { background:#0a0c12; }
.lists-container::-webkit-scrollbar-thumb { background:#2c5270; }
</style>
</head>
<body>
<div class="app-layout">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>BlackBoard</h2>
            <div class="save-indicator">
                <div class="save-dot" id="SaveDot"></div>
                <span class="save-text" id="SaveText">Kaydedildi</span>
            </div>
        </div>
        <div class="create-buttons">
            <button class="create-btn" id="AddFikirBtn">+ Fikir Ekle</button>
            <button class="create-btn" id="AddProjeBtn">+ Proje Ekle</button>
        </div>
        <div class="lists-container">
            <div class="list-section">
                <div class="section-label">FİKİRLER</div>
                <div class="items-list" id="fikirlerList"></div>
            </div>
            <div class="list-section">
                <div class="section-label">PROJELER</div>
                <div class="items-list" id="projelerList"></div>
            </div>
            <div class="trash-section">
                <button class="trash-btn" id="TrashBinBtn">🗑 Çöp Kutusu</button>
            </div>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main-board">
        <div class="board-header">
            <div class="header-top">
                <div class="active-info">
                    <h3 id="ActiveTitle">Ana Pano</h3>
                </div>
                <div class="board-actions" id="BoardActions">
                    <button class="action-btn primary" id="AddNoteToActiveBtn">+ Not Ekle</button>
                    <button class="action-btn" id="EnableLineEditBtn">Çizgileri Düzenle</button>
                    <button class="action-btn" id="UndoBtn" title="Ctrl+Z">↩ Geri Al</button>
                    <button class="action-btn warn" id="SaveManualBtn">💾 Kaydet</button>
                </div>
            </div>
            <div id="LineEditorContainer"></div>
            <div id="ModuleTabsContainer" class="module-tabs"></div>
        </div>
        <div class="whiteboard-canvas" id="WhiteboardCanvas">

    </div>
</div>

<div id="ToastMsg" class="toast-msg" style="opacity:0;"></div>
<div id="UndoHint" class="undo-hint">Geri alındı</div>

<script>
// ── DB ──
const DB_NAME = 'BlackBoardDB_v2';
const DB_VERSION = 1;
const STORE_NAME = 'appData';
let db = null;

// ── STATE ──
let fikirler = [];
let projeler = [];
let aktifTip = null, aktifId = null, aktifModulId = null;
let trashBin = [];
let connections = [], lineColors = {}, lineWidths = {};
let nextFikirId=1, nextProjeId=1, nextModulId=1, nextNoteId=100, nextTrashId=1, nextConnectionId=1;
let selectedNoteIds = new Set();
let isConnectingMode = false, connectingFromCard = null;
let isLineEditMode = false, selectedLineIds = new Set();
let isSelecting = false, selectionStart={x:0,y:0}, selectionRect=null;

// ── UNDO ──
const undoStack = [];
const MAX_UNDO = 50;
function pushUndo() {
    const snapshot = JSON.stringify({ fikirler, projeler, aktifTip, aktifId, aktifModulId, trashBin, connections, lineColors, lineWidths, nextFikirId, nextProjeId, nextModulId, nextNoteId, nextTrashId, nextConnectionId });
    undoStack.push(snapshot);
    if (undoStack.length > MAX_UNDO) undoStack.shift();
}
function performUndo() {
    if (undoStack.length === 0) { ShowToast("Geri alınacak işlem yok", 1200); return; }
    const snapshot = JSON.parse(undoStack.pop());
    fikirler = snapshot.fikirler || [];
    projeler = snapshot.projeler || [];
    aktifTip = snapshot.aktifTip;
    aktifId = snapshot.aktifId;
    aktifModulId = snapshot.aktifModulId;
    trashBin = snapshot.trashBin || [];
    connections = snapshot.connections || [];
    lineColors = snapshot.lineColors || {};
    lineWidths = snapshot.lineWidths || {};
    nextFikirId = snapshot.nextFikirId || 1;
    nextProjeId = snapshot.nextProjeId || 1;
    nextModulId = snapshot.nextModulId || 1;
    nextNoteId = snapshot.nextNoteId || 100;
    nextTrashId = snapshot.nextTrashId || 1;
    nextConnectionId = snapshot.nextConnectionId || 1;
    RenderSidebar(); RenderModuleTabs(); RenderBoard();
    SaveToDB(); ShowUndoHint();
}
function ShowUndoHint() {
    const el = document.getElementById('UndoHint');
    el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 1500);
}

// ── UNSAVED INDICATOR ──
let hasUnsaved = false;
let saveTimer = null;
function MarkUnsaved() {
    hasUnsaved = true;
    document.getElementById('SaveDot').classList.add('unsaved');
    document.getElementById('SaveText').textContent = 'Kaydedilmedi';
}
function MarkSaved() {
    hasUnsaved = false;
    document.getElementById('SaveDot').classList.remove('unsaved');
    document.getElementById('SaveText').textContent = 'Kaydedildi';
}
function DebounceSave() {
    MarkUnsaved();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => SaveToDB(), 1500);
}

const colorPalette = ["#1e293b","#2d1b36","#1a2e3a","#2a2a35","#1e3a4d","#2c2a3e","#1f3a3f","#3b2f2f","#2f3b2f"];
const lineColorsList = ["#60a5fa","#f59e0b","#10b981","#ef4444","#a855f7","#ec489a","#14b8a6","#f97316","#8b5cf6"];

const fikirlerListDiv = document.getElementById('fikirlerList');
const projelerListDiv = document.getElementById('projelerList');
const notesContainer = document.getElementById('NotesContainer');
const whiteboardCanvas = document.getElementById('WhiteboardCanvas');
const activeTitleSpan = document.getElementById('ActiveTitle');
const moduleTabsContainer = document.getElementById('ModuleTabsContainer');
const lineEditorContainer = document.getElementById('LineEditorContainer');
const toastEl = document.getElementById('ToastMsg');
const linesSvg = document.getElementById('LinesSvg');

function ShowToast(msg, dur=1400) {
    toastEl.style.opacity='1'; toastEl.innerText=msg;
    setTimeout(()=>toastEl.style.opacity='0', dur);
}
function EscapeHtml(str) {
    if(!str) return '';
    return str.replace(/[&<>'"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
}
function GetRandomPosition() {
    const rect = notesContainer.getBoundingClientRect();
    const w = rect.width||900, h=rect.height||500;
    return { left: Math.min(Math.max(50+Math.random()*(w-300),20),w-270), top: Math.min(Math.max(50+Math.random()*(h-250),20),h-200) };
}

// ── DB ──
function InitDB() {
    return new Promise((res,rej)=>{
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onerror=()=>rej(req.error);
        req.onsuccess=()=>{db=req.result;res();};
        req.onupgradeneeded=(e)=>{if(!e.target.result.objectStoreNames.contains(STORE_NAME)) e.target.result.createObjectStore(STORE_NAME);};
    });
}
async function SaveToDB() {
    if(!db) return;
    const data={fikirler,projeler,aktifTip,aktifId,aktifModulId,trashBin,nextFikirId,nextProjeId,nextModulId,nextNoteId,nextTrashId,nextConnectionId,connections,lineColors,lineWidths};
    const tx=db.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).put(data,'mainData');
    MarkSaved();
}
async function LoadFromDB() {
    if(!db) return;
    const tx=db.transaction(STORE_NAME,'readonly');
    return new Promise((res)=>{
        const req=tx.objectStore(STORE_NAME).get('mainData');
        req.onsuccess=()=>{
            const d=req.result;
            if(d){
                fikirler=d.fikirler||[]; projeler=d.projeler||[];
                aktifTip=d.aktifTip||null; aktifId=d.aktifId||null; aktifModulId=d.aktifModulId||null;
                trashBin=d.trashBin||[]; connections=d.connections||[];
                lineColors=d.lineColors||{}; lineWidths=d.lineWidths||{};
                nextFikirId=d.nextFikirId||1; nextProjeId=d.nextProjeId||1;
                nextModulId=d.nextModulId||1; nextNoteId=d.nextNoteId||100;
                nextTrashId=d.nextTrashId||1; nextConnectionId=d.nextConnectionId||1;
            } else CreateInitialData();
            res();
        };
        req.onerror=()=>{CreateInitialData();res();};
    });
}
function CreateInitialData() {
    const note1 = { id:nextNoteId++, title:"Mobil Uygulama Fikri", type:"text", blocks:[{type:"text",id:1,content:"Kullanıcı dostu arayüz ile hızlı not alma"}], left:80, top:70, bgColor:"#1e293b" };
    fikirler=[{id:nextFikirId++, name:"Mobil Uygulama", notes:[note1]}];
    const note2 = { id:nextNoteId++, title:"Başlangıç Adımları", type:"steps", blocks:[{type:"steps",id:1,items:[{id:1,text:"Gereksinimleri belirle"},{id:2,text:"Prototip yap"},{id:3,text:"Test et"}]}], left:100, top:80, bgColor:"#1e293b" };
    const note3 = { id:nextNoteId++, title:"Kontrol Listesi", type:"checklist", blocks:[{type:"checklist",id:1,items:[{id:1,text:"PID kontrol",done:false},{id:2,text:"Sensor füzyonu",done:true}]}], left:420, top:130, bgColor:"#1e3a4d" };
    const modul1={id:nextModulId++, name:"Ana Modül", notes:[note2]};
    const modul2={id:nextModulId++, name:"Algoritmalar", notes:[note3]};
    projeler=[{id:nextProjeId++, name:"Drone Projesi", modules:[modul1,modul2]}];
    aktifTip='fikir'; aktifId=fikirler[0].id; aktifModulId=null;
    connections=[]; lineColors={}; lineWidths={};
}

// ── MODAL ──
function ShowModal(title, placeholder, onConfirm, defaultValue="", confirmLabel="Ekle") {
    const modal=document.createElement('div'); modal.className='modal-overlay';
    modal.innerHTML=`<div class="modal-container"><h3>${title}</h3><input type="text" class="modal-input" id="MI" placeholder="${placeholder}" value="${EscapeHtml(defaultValue)}"><div class="modal-buttons"><button class="modal-btn modal-btn-cancel" id="MC">İptal</button><button class="modal-btn modal-btn-confirm" id="MK">${confirmLabel}</button></div></div>`;
    document.body.appendChild(modal);
    const inp=modal.querySelector('#MI'); inp.focus(); inp.select();
    modal.querySelector('#MC').onclick=()=>modal.remove();
    modal.querySelector('#MK').onclick=()=>{const v=inp.value.trim();if(v){onConfirm(v);}modal.remove();};
    inp.addEventListener('keypress',(e)=>{if(e.key==='Enter')modal.querySelector('#MK').click();});
}

// ── BLOCK HELPERS ──
function MakeBlock(type) {
    const blockId = Date.now() + Math.random();
    if (type==='text') return {type:'text', id:blockId, content:''};
    if (type==='checklist') return {type:'checklist', id:blockId, items:[{id:Date.now(),text:'',done:false}]};
    if (type==='steps') return {type:'steps', id:blockId, items:[{id:Date.now(),text:''}]};
    if (type==='code') return {type:'code', id:blockId, lang:'python', content:''};
    if (type==='link') return {type:'link', id:blockId, url:'', label:''};
    return null;
}
function EnsureBlocks(note) {
    if (!note.blocks) {
        note.blocks = [];
        if (note.content) note.blocks.push({type:'text',id:Date.now(),content:note.content||''});
        delete note.content;
    }
    if (note.blocks.length === 0) note.blocks.push(MakeBlock('text'));
}

// ── RENDER BLOCK (inline in card) ──
function RenderBlockElement(block, note, isExpand) {
    const wrapper = document.createElement('div');
    wrapper.className = 'block';
    wrapper.setAttribute('data-block-id', block.id);

    const delBtn = document.createElement('button');
    delBtn.className = 'block-delete-btn';
    delBtn.title = 'Bloğu sil';
    delBtn.innerHTML = '✕';
    delBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        pushUndo();
        note.blocks = note.blocks.filter(b=>b.id!==block.id);
        if(note.blocks.length===0) note.blocks.push(MakeBlock('text'));
        DebounceSave();
        if(isExpand) return; // expand modal re-renders itself
        RenderBoard();
    });

    if (block.type==='text') {
        wrapper.classList.add('block-text');
        const ta = document.createElement('textarea');
        ta.value = block.content||'';
        ta.placeholder = 'Notunu yaz...';
        ta.style.userSelect = 'text';
        ta.addEventListener('input', ()=>{ block.content=ta.value; DebounceSave(); });
        ta.addEventListener('mousedown', e=>e.stopPropagation());
        wrapper.appendChild(ta);
    }
    else if (block.type==='checklist') {
        wrapper.classList.add('block-checklist');
        const renderItems = () => {
            wrapper.innerHTML='';
            block.items.forEach((item,idx)=>{
                const row=document.createElement('div'); row.className='checklist-item';
                const cb=document.createElement('input'); cb.type='checkbox'; cb.className='checklist-cb'; cb.checked=item.done;
                cb.addEventListener('change',()=>{ item.done=cb.checked; renderItems(); DebounceSave(); });
                cb.addEventListener('mousedown',e=>e.stopPropagation());
                const lbl=document.createElement('input'); lbl.type='text'; lbl.className='checklist-label'+(item.done?' done':'');
                lbl.style.userSelect='text'; lbl.value=item.text;
                lbl.placeholder='Liste maddesi...';
                lbl.addEventListener('input',()=>{ item.text=lbl.value; DebounceSave(); });
                lbl.addEventListener('mousedown',e=>e.stopPropagation());
                lbl.addEventListener('keydown',(e)=>{
                    if(e.key==='Enter'){ e.preventDefault(); block.items.splice(idx+1,0,{id:Date.now(),text:'',done:false}); renderItems(); DebounceSave(); setTimeout(()=>{ const inputs=wrapper.querySelectorAll('.checklist-label'); if(inputs[idx+1]) inputs[idx+1].focus(); },50); }
                    if(e.key==='Backspace'&&lbl.value===''&&block.items.length>1){ e.preventDefault(); block.items.splice(idx,1); renderItems(); DebounceSave(); }
                });
                const dl=document.createElement('button'); dl.className='checklist-del'; dl.innerHTML='✕';
                dl.addEventListener('click',()=>{ block.items.splice(idx,1); if(block.items.length===0) block.items.push({id:Date.now(),text:'',done:false}); renderItems(); DebounceSave(); });
                row.appendChild(cb); row.appendChild(lbl); row.appendChild(dl);
                wrapper.appendChild(row);
            });
            const addBtn=document.createElement('button'); addBtn.className='add-checklist-item'; addBtn.innerText='+ Madde ekle';
            addBtn.addEventListener('click',()=>{ block.items.push({id:Date.now(),text:'',done:false}); renderItems(); DebounceSave(); });
            addBtn.addEventListener('mousedown',e=>e.stopPropagation());
            wrapper.appendChild(addBtn);
        };
        renderItems();
    }
    else if (block.type==='steps') {
        wrapper.classList.add('block-steps');
        const renderSteps = () => {
            wrapper.innerHTML='';
            block.items.forEach((item,idx)=>{
                const row=document.createElement('div'); row.className='step-item';
                const num=document.createElement('div'); num.className='step-num'; num.innerText=idx+1;
                const ta=document.createElement('textarea'); ta.className='step-text';
                ta.style.userSelect='text'; ta.value=item.text; ta.placeholder='Adım açıklaması...'; ta.rows=1;
                ta.addEventListener('input',()=>{ item.text=ta.value; ta.style.height='auto'; ta.style.height=ta.scrollHeight+'px'; DebounceSave(); });
                ta.addEventListener('mousedown',e=>e.stopPropagation());
                ta.addEventListener('keydown',(e)=>{
                    if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); block.items.splice(idx+1,0,{id:Date.now(),text:''}); renderSteps(); DebounceSave(); setTimeout(()=>{ const tas=wrapper.querySelectorAll('.step-text'); if(tas[idx+1]) tas[idx+1].focus(); },50); }
                });
                const dl=document.createElement('button'); dl.className='step-del'; dl.innerHTML='✕';
                dl.addEventListener('click',()=>{ block.items.splice(idx,1); if(block.items.length===0) block.items.push({id:Date.now(),text:''}); renderSteps(); DebounceSave(); });
                row.appendChild(num); row.appendChild(ta); row.appendChild(dl);
                wrapper.appendChild(row);
            });
            const addBtn=document.createElement('button'); addBtn.className='add-step-item'; addBtn.innerText='+ Adım ekle';
            addBtn.addEventListener('click',()=>{ block.items.push({id:Date.now(),text:''}); renderSteps(); DebounceSave(); });
            addBtn.addEventListener('mousedown',e=>e.stopPropagation());
            wrapper.appendChild(addBtn);
        };
        renderSteps();
    }
    else if (block.type==='code') {
        wrapper.classList.add('block-code');
        const bar=document.createElement('div'); bar.className='code-lang-bar';
        const langs=['python','javascript','c','cpp','rust','go','bash','json','yaml','other'];
        const sel=document.createElement('select'); sel.className='code-lang-select';
        langs.forEach(l=>{ const o=document.createElement('option'); o.value=l; o.text=l; if(l===block.lang) o.selected=true; sel.appendChild(o); });
        sel.addEventListener('change',()=>{ block.lang=sel.value; DebounceSave(); });
        sel.addEventListener('mousedown',e=>e.stopPropagation());
        const copyBtn=document.createElement('button'); copyBtn.className='code-copy-btn'; copyBtn.innerText='Kopyala';
        copyBtn.addEventListener('click',()=>{ navigator.clipboard.writeText(ta.value).then(()=>ShowToast("Kod kopyalandı",900)); });
        copyBtn.addEventListener('mousedown',e=>e.stopPropagation());
        bar.appendChild(sel); bar.appendChild(copyBtn);
        const ta=document.createElement('textarea');
        ta.style.userSelect='text'; ta.value=block.content||''; ta.placeholder='// Kodunu buraya yaz...';
        ta.addEventListener('input',()=>{ block.content=ta.value; DebounceSave(); });
        ta.addEventListener('mousedown',e=>e.stopPropagation());
        ta.addEventListener('keydown',(e)=>{ if(e.key==='Tab'){ e.preventDefault(); const s=ta.selectionStart,en=ta.selectionEnd; ta.value=ta.value.substring(0,s)+'    '+ta.value.substring(en); ta.selectionStart=ta.selectionEnd=s+4; } });
        wrapper.appendChild(bar); wrapper.appendChild(ta);
    }
    else if (block.type==='link') {
        wrapper.classList.add('block-link');
        const urlInp=document.createElement('input'); urlInp.type='url'; urlInp.className='link-url-inp';
        urlInp.style.userSelect='text'; urlInp.value=block.url||''; urlInp.placeholder='https://...';
        urlInp.addEventListener('input',()=>{ block.url=urlInp.value; DebounceSave(); });
        urlInp.addEventListener('mousedown',e=>e.stopPropagation());
        const lblInp=document.createElement('input'); lblInp.type='text'; lblInp.className='link-label-inp';
        lblInp.style.userSelect='text'; lblInp.value=block.label||''; lblInp.placeholder='Bağlantı açıklaması...';
        lblInp.addEventListener('input',()=>{ block.label=lblInp.value; DebounceSave(); });
        lblInp.addEventListener('mousedown',e=>e.stopPropagation());
        if (block.url) {
            const openBtn=document.createElement('a'); openBtn.href=block.url; openBtn.target='_blank';
            openBtn.style.cssText='display:block;font-size:0.68rem;color:#60a5fa;margin-top:5px;text-decoration:none;';
            openBtn.innerText='↗ Aç';
            wrapper.appendChild(urlInp); wrapper.appendChild(lblInp); wrapper.appendChild(openBtn);
        } else {
            wrapper.appendChild(urlInp); wrapper.appendChild(lblInp);
        }
    }

    wrapper.appendChild(delBtn);
    return wrapper;
}

// ── ADD BLOCK BAR ──
function MakeAddBlockBar(note, isExpand, container) {
    const bar = document.createElement('div');
    bar.className = isExpand ? 'expand-addbar' : 'card-addblock-bar';
    const types = [['text','📝 Metin'],['checklist','☑ Liste'],['steps','🔢 Adımlar'],['code','</> Kod'],['link','🔗 Link']];
    types.forEach(([t,label])=>{
        const btn=document.createElement('button'); btn.className='addblock-btn'; btn.innerText=label;
        btn.addEventListener('mousedown',e=>e.stopPropagation());
        btn.addEventListener('click',(e)=>{
            e.stopPropagation();
            pushUndo();
            const block=MakeBlock(t);
            note.blocks.push(block);
            DebounceSave();
            if(isExpand) {
                // re-render blocks in expand modal
                RenderExpandBlocks(note, container);
            } else {
                RenderBoard();
            }
        });
        bar.appendChild(btn);
    });
    return bar;
}

function RenderExpandBlocks(note, blocksContainer) {
    blocksContainer.innerHTML='';
    note.blocks.forEach(block=>{
        blocksContainer.appendChild(RenderBlockElement(block, note, true));
    });
}

// ── EXPAND MODAL ──
function OpenExpandModal(note) {
    EnsureBlocks(note);
    const overlay=document.createElement('div'); overlay.className='expand-overlay';
    const typeLabels={text:'Metin',checklist:'Liste',steps:'Adımlar',code:'Kod',link:'Link',mixed:'Karma'};
    overlay.innerHTML=`
        <div class="expand-container">
            <div class="expand-header">
                <input class="expand-title-inp" value="${EscapeHtml(note.title)}" placeholder="Başlık..." style="user-select:text;">
                <span class="expand-type">${note.type||'Not'}</span>
                <button class="expand-close" id="ExCl">✕</button>
            </div>
            <div class="expand-body" id="ExBody"></div>
            <div id="ExAddBar"></div>
        </div>
    `;
    document.body.appendChild(overlay);
    const titleInp=overlay.querySelector('.expand-title-inp');
    titleInp.addEventListener('input',()=>{ note.title=titleInp.value; DebounceSave(); });
    const exBody=overlay.querySelector('#ExBody');
    RenderExpandBlocks(note, exBody);
    overlay.querySelector('#ExAddBar').appendChild(MakeAddBlockBar(note, true, exBody));
    overlay.querySelector('#ExCl').onclick=()=>{ overlay.remove(); RenderBoard(); };
    overlay.addEventListener('click',(e)=>{ if(e.target===overlay) { overlay.remove(); RenderBoard(); } });
}

// ── NOTE CARD ──
function RenderNoteCard(note) {
    EnsureBlocks(note);
    const card=document.createElement('div');
    card.className='idea-card';
    card.setAttribute('data-note-id', note.id);
    card.style.left=note.left+'px'; card.style.top=note.top+'px';
    card.style.backgroundColor=note.bgColor||'#141a24';
    if(selectedNoteIds.has(note.id)) card.classList.add('selected-card');

    // Titlebar
    const titlebar=document.createElement('div'); titlebar.className='card-titlebar';
    titlebar.innerHTML=`<span class="drag-area">::</span>`;
    const titleInp=document.createElement('input'); titleInp.type='text'; titleInp.className='card-title';
    titleInp.value=note.title||''; titleInp.placeholder='Başlık'; titleInp.style.userSelect='text';
    titleInp.addEventListener('change',()=>{ note.title=titleInp.value; DebounceSave(); RenderLines(); });
    titleInp.addEventListener('mousedown',e=>e.stopPropagation());
    const connBtn=document.createElement('button'); connBtn.className='connector-btn'; connBtn.setAttribute('data-connect-id',note.id); connBtn.title='Bağlantı kur'; connBtn.innerHTML='⊕';
    connBtn.addEventListener('click',(e)=>{ e.stopPropagation(); StartConnecting(note.id); });
    connBtn.addEventListener('mousedown',e=>e.stopPropagation());
    const delBtn=document.createElement('button'); delBtn.className='delete-card'; delBtn.innerHTML='✕'; delBtn.title='Notu sil';
    delBtn.addEventListener('click',(e)=>{ e.stopPropagation(); pushUndo(); DeleteNote(note.id); });
    delBtn.addEventListener('mousedown',e=>e.stopPropagation());
    titlebar.appendChild(titleInp); titlebar.appendChild(connBtn); titlebar.appendChild(delBtn);
    card.appendChild(titlebar);

    // Body (first block only for compact view, or first 2)
    const body=document.createElement('div'); body.className='card-body';
    const displayBlocks=note.blocks.slice(0,2);
    displayBlocks.forEach(block=>body.appendChild(RenderBlockElement(block, note, false)));
    if(note.blocks.length>2){
        const more=document.createElement('div'); more.style.cssText='color:#5a6e85;font-size:0.65rem;padding:4px 8px;';
        more.innerText=`+ ${note.blocks.length-2} blok daha...`;
        body.appendChild(more);
    }
    card.appendChild(body);

    // Add block bar (compact)
    card.appendChild(MakeAddBlockBar(note, false, null));

    // Footer
    const footer=document.createElement('div'); footer.className='card-footer';
    const colorSel=document.createElement('div'); colorSel.className='color-selector';
    colorPalette.forEach(color=>{
        const dot=document.createElement('div'); dot.className='color-option';
        dot.style.backgroundColor=color;
        dot.style.border=note.bgColor===color?'2px solid #fff':'1px solid rgba(255,255,255,0.2)';
        dot.addEventListener('mousedown',e=>e.stopPropagation());
        dot.addEventListener('click',(e)=>{
            e.stopPropagation();
            note.bgColor=color; card.style.backgroundColor=color;
            colorSel.querySelectorAll('.color-option').forEach(d=>d.style.border=d.style.backgroundColor===color?'2px solid #fff':'1px solid rgba(255,255,255,0.2)');
            DebounceSave();
        });
        colorSel.appendChild(dot);
    });
    const expandBtn=document.createElement('button'); expandBtn.className='expand-card-btn'; expandBtn.innerText='Genişlet ↗';
    expandBtn.addEventListener('mousedown',e=>e.stopPropagation());
    expandBtn.addEventListener('click',(e)=>{ e.stopPropagation(); OpenExpandModal(note); });
    footer.appendChild(colorSel); footer.appendChild(expandBtn);
    card.appendChild(footer);

    // Connection points
    ['top','bottom','left','right'].forEach(pos=>{
        const pt=document.createElement('div'); pt.className=`connection-point ${pos}`;
        pt.addEventListener('click',(e)=>{ e.stopPropagation(); StartConnecting(note.id); });
        card.appendChild(pt);
    });

    card.addEventListener('click',(e)=>{
        if(e.target.closest('.delete-card')||e.target.closest('.connector-btn')||e.target.closest('.color-option')||e.target.closest('.connection-point')||e.target.closest('.expand-card-btn')||e.target.closest('.addblock-btn')||e.target.closest('.block')) return;
        SelectCard(card, note.id);
    });
    card.addEventListener('mousedown',(e)=>{
        if(e.target.closest('.delete-card')||e.target.closest('.card-title')||e.target.closest('.block')||e.target.closest('.connector-btn')||e.target.closest('.connection-point')||e.target.closest('.color-option')||e.target.closest('.expand-card-btn')||e.target.closest('.addblock-btn')) return;
        e.preventDefault();
        StartDrag(e, card, note);
    });

    notesContainer.appendChild(card);
}

// ── DRAG ──
let DragActive=false, DragCard=null, DragNote=null, StartX, StartY, StartLeft, StartTop;
function StartDrag(e, cardEl, noteObj) {
    const r=cardEl.getBoundingClientRect(), cr=notesContainer.getBoundingClientRect();
    DragActive=true; DragCard=cardEl; DragNote=noteObj;
    StartX=e.clientX; StartY=e.clientY; StartLeft=r.left-cr.left; StartTop=r.top-cr.top;
    document.body.style.userSelect='none'; cardEl.style.cursor='grabbing';
    const onMove=(mv)=>{
        if(!DragActive) return; mv.preventDefault();
        let nl=StartLeft+(mv.clientX-StartX), nt=StartTop+(mv.clientY-StartY);
        const pr=notesContainer.getBoundingClientRect();
        nl=Math.min(Math.max(nl,5),Math.max(pr.width-DragCard.offsetWidth,5));
        nt=Math.min(Math.max(nt,5),Math.max(pr.height-DragCard.offsetHeight,5));
        DragCard.style.left=nl+'px'; DragCard.style.top=nt+'px';
        if(DragNote){DragNote.left=nl; DragNote.top=nt;}
        RenderLines();
    };
    const onUp=()=>{
        if(DragActive){DragActive=false; document.body.style.userSelect=''; if(DragCard)DragCard.style.cursor='grab'; document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); DebounceSave(); RenderLines();}
    };
    document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
}

// ── SELECT ──
function SelectCard(cardEl, noteId) {
    if(isConnectingMode && connectingFromCard) {
        if(connectingFromCard!==noteId){ AddConnection(connectingFromCard,noteId); }
        else { ShowToast("Aynı nota bağlantı yapamazsınız",800); }
        isConnectingMode=false; connectingFromCard=null;
        document.querySelectorAll('.connector-btn').forEach(b=>b.classList.remove('active-connector'));
        document.querySelectorAll('.idea-card').forEach(c=>c.classList.remove('selected-card'));
        selectedNoteIds.clear(); return;
    }
    document.querySelectorAll('.idea-card').forEach(c=>c.classList.remove('selected-card'));
    selectedNoteIds.clear();
    cardEl.classList.add('selected-card');
    selectedNoteIds.add(noteId);
}

function StartConnecting(noteId) {
    isConnectingMode=true; connectingFromCard=noteId;
    document.querySelectorAll('.connector-btn').forEach(b=>b.classList.remove('active-connector'));
    const btn=document.querySelector(`.connector-btn[data-connect-id='${noteId}']`);
    if(btn) btn.classList.add('active-connector');
    ShowToast("Bağlanmak istediğiniz nota tıklayın",1500);
}

// ── CONNECTIONS ──
function AddConnection(from, to) {
    if(from===to){ShowToast("Aynı nota bağlantı olmaz",1000); return false;}
    if(connections.some(c=>(c.from===from&&c.to===to)||(c.from===to&&c.to===from))){ShowToast("Bu bağlantı zaten var",1000); return false;}
    pushUndo();
    const nid=nextConnectionId++;
    connections.push({id:nid,from,to});
    RenderLines(); DebounceSave(); ShowToast("Bağlantı oluşturuldu",800); return true;
}
function RemoveConnection(cid) {
    pushUndo();
    connections=connections.filter(c=>c.id!==cid);
    delete lineColors[cid]; delete lineWidths[cid]; selectedLineIds.delete(cid);
    RenderLines(); DebounceSave(); ShowToast("Bağlantı kaldırıldı",800);
}
function RemoveConnectionsForNote(noteId) {
    const toDelete=connections.filter(c=>c.from===noteId||c.to===noteId);
    toDelete.forEach(c=>{ delete lineColors[c.id]; delete lineWidths[c.id]; selectedLineIds.delete(c.id); });
    connections=connections.filter(c=>c.from!==noteId&&c.to!==noteId);
    RenderLines(); DebounceSave();
}
function RenderLines() {
    linesSvg.innerHTML='';
    connections.forEach(conn=>{
        const fc=document.querySelector(`.idea-card[data-note-id='${conn.from}']`);
        const tc=document.querySelector(`.idea-card[data-note-id='${conn.to}']`);
        if(!fc||!tc) return;
        const fr=fc.getBoundingClientRect(), tr=tc.getBoundingClientRect();
        const cr=notesContainer.getBoundingClientRect();
        const x1=fr.left+fr.width/2-cr.left, y1=fr.top+fr.height/2-cr.top;
        const x2=tr.left+tr.width/2-cr.left, y2=tr.top+tr.height/2-cr.top;
        const color=lineColors[conn.id]||'#60a5fa';
        const width=lineWidths[conn.id]||3;
        const isSel=isLineEditMode&&selectedLineIds.has(conn.id);
        const line=document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1',x1); line.setAttribute('y1',y1);
        line.setAttribute('x2',x2); line.setAttribute('y2',y2);
        line.setAttribute('stroke', isSel?'#f59e0b':color);
        line.setAttribute('stroke-width', isSel?width+3:width);
        line.setAttribute('stroke-dasharray','6,4');
        line.style.cursor='pointer'; line.style.pointerEvents='stroke';
        line.addEventListener('click',(e)=>{
            e.stopPropagation();
            if(isLineEditMode) ToggleLineSelection(conn.id);
            else if(confirm('Bu bağlantıyı silmek istiyor musunuz?')) RemoveConnection(conn.id);
        });
        linesSvg.appendChild(line);
    });
}

// ── LINE EDIT MODE ──
function EnableLineEditMode() {
    if(connections.length===0){ShowToast("Düzenlenecek çizgi yok",1500);return;}
    isLineEditMode=true; selectedLineIds.clear(); RenderLineEditorBar(); RenderLines();
    ShowToast("Çizgi düzenleme modu aktif",1800);
}
function DisableLineEditMode() {
    isLineEditMode=false; selectedLineIds.clear(); RenderLineEditorBar(); RenderLines();
}
function ToggleLineSelection(lid) {
    if(selectedLineIds.has(lid)) selectedLineIds.delete(lid); else selectedLineIds.add(lid);
    RenderLineEditorBar(); RenderLines();
}
function ApplyColorToSelected(color) {
    if(selectedLineIds.size===0){ShowToast("Önce çizgi seçin",1000);return;}
    selectedLineIds.forEach(id=>lineColors[id]=color); RenderLines(); DebounceSave();
    ShowToast(selectedLineIds.size+" çizginin rengi değiştirildi",1000);
}
function ApplyStrokeToSelected(w) {
    if(selectedLineIds.size===0){ShowToast("Önce çizgi seçin",1000);return;}
    selectedLineIds.forEach(id=>lineWidths[id]=w); RenderLines(); DebounceSave();
}
function DeleteSelectedLines() {
    if(selectedLineIds.size===0){ShowToast("Silinecek çizgi seçin",1000);return;}
    if(!confirm(selectedLineIds.size+" çizgiyi silmek istiyor musunuz?")) return;
    pushUndo();
    connections=connections.filter(c=>!selectedLineIds.has(c.id));
    selectedLineIds.forEach(id=>{delete lineColors[id];delete lineWidths[id];});
    selectedLineIds.clear(); DebounceSave(); RenderLines();
    if(connections.length===0) DisableLineEditMode(); else RenderLineEditorBar();
    ShowToast("Seçilen çizgiler silindi",1200);
}
function DeleteAllLines() {
    if(connections.length===0){ShowToast("Silinecek çizgi yok",1000);return;}
    if(!confirm("Tüm "+connections.length+" çizgiyi silmek istiyor musunuz?")) return;
    pushUndo();
    connections=[]; lineColors={}; lineWidths={}; selectedLineIds.clear();
    DebounceSave(); RenderLines(); DisableLineEditMode(); ShowToast("Tüm çizgiler silindi",1200);
}
function RenderLineEditorBar() {
    if(!isLineEditMode){lineEditorContainer.innerHTML='';return;}
    lineEditorContainer.innerHTML=`
        <div class="line-editor-bar">
            <span class="line-editor-label">Çizgi Düzenleme</span>
            <span class="selection-info">${selectedLineIds.size} seçili</span>
            <div class="color-picker-group">${lineColorsList.map(c=>`<div class="line-color-option" style="background:${c}" data-c="${c}"></div>`).join('')}</div>
            <div class="color-picker-group">
                <button class="stroke-btn" data-w="2">İnce</button>
                <button class="stroke-btn" data-w="4">Normal</button>
                <button class="stroke-btn" data-w="6">Kalın</button>
            </div>
            <div class="color-picker-group">
                <button class="line-action-btn" id="SelAllL">Tümünü Seç</button>
                <button class="line-action-btn" id="DeSelL">Seçimi Kaldır</button>
                <button class="line-action-btn" id="DelSelL" style="background:#b91c1c;color:#fff;">Seçilenleri Sil</button>
                <button class="line-action-btn" id="DelAllL" style="background:#7f1d1d;color:#fff;">Tümünü Sil</button>
            </div>
            <button class="close-editor-btn" id="CloseLineEd">Düzenlemeyi Kapat</button>
        </div>`;
    document.querySelectorAll('.line-color-option').forEach(el=>el.onclick=()=>ApplyColorToSelected(el.getAttribute('data-c')));
    document.querySelectorAll('.stroke-btn').forEach(el=>el.onclick=()=>ApplyStrokeToSelected(parseInt(el.getAttribute('data-w'))));
    document.getElementById('SelAllL').onclick=()=>{ connections.forEach(c=>selectedLineIds.add(c.id)); RenderLineEditorBar(); RenderLines(); ShowToast(selectedLineIds.size+" çizgi seçildi",1000); };
    document.getElementById('DeSelL').onclick=()=>{ selectedLineIds.clear(); RenderLineEditorBar(); RenderLines(); };
    document.getElementById('DelSelL').onclick=()=>DeleteSelectedLines();
    document.getElementById('DelAllL').onclick=()=>DeleteAllLines();
    document.getElementById('CloseLineEd').onclick=()=>DisableLineEditMode();
}

// ── MOUSE SELECTION (cards + lines) ──
function initSelection() {
    selectionRect=document.getElementById('SelectionRect');
    whiteboardCanvas.addEventListener('mousedown',(e)=>{
        if(e.target.closest('.idea-card')||e.target.closest('.connection-point')||e.target.closest('.connector-btn')) return;
        if(e.button!==0) return;
        isSelecting=true;
        const r=whiteboardCanvas.getBoundingClientRect();
        selectionStart.x=e.clientX-r.left; selectionStart.y=e.clientY-r.top;
        selectionRect.style.display='block';
        selectionRect.style.left=selectionStart.x+'px'; selectionRect.style.top=selectionStart.y+'px';
        selectionRect.style.width='0px'; selectionRect.style.height='0px';
        selectedNoteIds.clear(); selectedLineIds.clear();
        document.querySelectorAll('.idea-card').forEach(c=>c.classList.remove('selected-card'));
    });
    window.addEventListener('mousemove',(e)=>{
        if(!isSelecting) return;
        const r=whiteboardCanvas.getBoundingClientRect();
        const cx=e.clientX-r.left, cy=e.clientY-r.top;
        const l=Math.min(selectionStart.x,cx), t=Math.min(selectionStart.y,cy);
        const w=Math.abs(cx-selectionStart.x), h=Math.abs(cy-selectionStart.y);
        selectionRect.style.left=l+'px'; selectionRect.style.top=t+'px';
        selectionRect.style.width=w+'px'; selectionRect.style.height=h+'px';
    });
    window.addEventListener('mouseup',(e)=>{
        if(!isSelecting) return;
        isSelecting=false;
        const r=whiteboardCanvas.getBoundingClientRect();
        const ex=e.clientX-r.left, ey=e.clientY-r.top;
        const l=Math.min(selectionStart.x,ex), t=Math.min(selectionStart.y,ey);
        const ri=Math.max(selectionStart.x,ex), b=Math.max(selectionStart.y,ey);
        if(ri-l>5&&b-t>5) {
            // Select cards
            document.querySelectorAll('.idea-card').forEach(card=>{
                const cr=card.getBoundingClientRect();
                const cl=cr.left-r.left, ct=cr.top-r.top, crr=cr.right-r.left, cb=cr.bottom-r.top;
                if(crr>l&&cl<ri&&cb>t&&ct<b){
                    const nid=parseInt(card.getAttribute('data-note-id'));
                    selectedNoteIds.add(nid); card.classList.add('selected-card');
                }
            });
            // Select lines (check midpoint)
            if(isLineEditMode) {
                connections.forEach(conn=>{
                    const fc=document.querySelector(`.idea-card[data-note-id='${conn.from}']`);
                    const tc=document.querySelector(`.idea-card[data-note-id='${conn.to}']`);
                    if(!fc||!tc) return;
                    const fr=fc.getBoundingClientRect(), tr=tc.getBoundingClientRect();
                    const mx=(fr.left+fr.width/2+tr.left+tr.width/2)/2-r.left;
                    const my=(fr.top+fr.height/2+tr.top+tr.height/2)/2-r.top;
                    if(mx>l&&mx<ri&&my>t&&my<b) selectedLineIds.add(conn.id);
                });
                RenderLineEditorBar(); RenderLines();
            }
            const total=selectedNoteIds.size+(isLineEditMode?selectedLineIds.size:0);
            if(total>0) ShowToast(total+" öğe seçildi. Delete ile sil.",2000);
        }
        selectionRect.style.display='none';
    });
    window.addEventListener('keydown',(e)=>{
        if(e.ctrlKey&&e.key==='z') { e.preventDefault(); performUndo(); return; }
        if(e.key==='Delete') {
            if(isLineEditMode&&selectedLineIds.size>0){ DeleteSelectedLines(); return; }
            if(selectedNoteIds.size>0){
                if(confirm(selectedNoteIds.size+" notu silmek istiyor musunuz?")){
                    pushUndo();
                    selectedNoteIds.forEach(nid=>DeleteNote(nid, true));
                    selectedNoteIds.clear(); ShowToast("Seçilen notlar silindi",1000);
                }
            }
        }
        if(e.key==='Escape'){
            selectedNoteIds.clear(); selectedLineIds.clear();
            document.querySelectorAll('.idea-card').forEach(c=>c.classList.remove('selected-card'));
            if(isConnectingMode){ isConnectingMode=false; connectingFromCard=null; document.querySelectorAll('.connector-btn').forEach(b=>b.classList.remove('active-connector')); }
            if(isLineEditMode){ RenderLineEditorBar(); RenderLines(); }
        }
    });
}

// ── FİKİR OPS ──
function AddNewFikir() {
    ShowModal('Yeni Fikir','Fikir adı...',(name)=>{
        pushUndo();
        const f={id:nextFikirId++,name,notes:[]};
        fikirler.push(f); RenderSidebar(); SetActiveFikir(f.id); DebounceSave();
        ShowToast('"'+name+'" fikri eklendi');
    });
}
function SetActiveFikir(fid) {
    const f=fikirler.find(fk=>fk.id===fid); if(!f) return;
    aktifTip='fikir'; aktifId=fid; aktifModulId=null;
    activeTitleSpan.innerText=f.name;
    moduleTabsContainer.innerHTML='';
    selectedNoteIds.clear(); isConnectingMode=false; connectingFromCard=null;
    if(isLineEditMode) DisableLineEditMode();
    RenderSidebar(); RenderBoard(); DebounceSave();
}
function DeleteFikir(id) {
    const idx=fikirler.findIndex(f=>f.id===id); if(idx===-1) return;
    pushUndo();
    const f=fikirler[idx];
    f.notes.forEach(note=>trashBin.push({id:nextTrashId++,type:'not',name:note.title,parentName:f.name,deletedAt:new Date().toISOString(),originalData:note,parentId:f.id,parentType:'fikir'}));
    trashBin.push({id:nextTrashId++,type:'fikir',name:f.name,parentName:'Genel',deletedAt:new Date().toISOString(),originalData:{name:f.name,notes:f.notes},parentId:null,parentType:null});
    fikirler.splice(idx,1);
    if(aktifTip==='fikir'&&aktifId===id){ if(fikirler.length>0) SetActiveFikir(fikirler[0].id); else if(projeler.length>0) SetActiveProje(projeler[0].id); else {aktifTip=null;aktifId=null;activeTitleSpan.innerText='Ana Pano';moduleTabsContainer.innerHTML='';RenderBoard();} }
    RenderSidebar(); DebounceSave(); ShowToast('"'+f.name+'" çöp kutusuna taşındı');
}
function ConvertFikirToProje(fid) {
    const f=fikirler.find(fk=>fk.id===fid); if(!f) return;
    if(!confirm('"'+f.name+'" fikrini projeye dönüştürmek istiyor musunuz?\nFikir silinecek, notlar yeni projenin "Genel" modülüne taşınacak.')) return;
    pushUndo();
    const modul={id:nextModulId++,name:'Genel',notes:[...f.notes]};
    const proje={id:nextProjeId++,name:f.name,modules:[modul]};
    projeler.push(proje);
    fikirler.splice(fikirler.indexOf(f),1);
    RenderSidebar(); SetActiveProje(proje.id); DebounceSave();
    ShowToast('"'+f.name+'" projeye dönüştürüldü!',2000);
}

// ── PROJE OPS ──
function AddNewProje() {
    ShowModal('Yeni Proje','Proje adı...',(name)=>{
        pushUndo();
        const p={id:nextProjeId++,name,modules:[]};
        projeler.push(p); RenderSidebar(); SetActiveProje(p.id); DebounceSave();
        ShowToast('"'+name+'" projesi eklendi');
    });
}
function SetActiveProje(pid) {
    const p=projeler.find(pp=>pp.id===pid); if(!p) return;
    aktifTip='proje'; aktifId=pid;
    activeTitleSpan.innerText=p.name;
    if(p.modules.length>0){ aktifModulId=p.modules.find(m=>m.id===aktifModulId)?aktifModulId:p.modules[0].id; } else aktifModulId=null;
    selectedNoteIds.clear(); isConnectingMode=false; connectingFromCard=null;
    if(isLineEditMode) DisableLineEditMode();
    RenderSidebar(); RenderModuleTabs(); RenderBoard(); DebounceSave();
}
function DeleteProje(id) {
    const idx=projeler.findIndex(p=>p.id===id); if(idx===-1) return;
    pushUndo();
    const p=projeler[idx];
    p.modules.forEach(m=>{ m.notes.forEach(note=>trashBin.push({id:nextTrashId++,type:'not',name:note.title,parentName:p.name+' / '+m.name,deletedAt:new Date().toISOString(),originalData:note,parentId:p.id,parentType:'proje',modulId:m.id})); trashBin.push({id:nextTrashId++,type:'modul',name:m.name,parentName:p.name,deletedAt:new Date().toISOString(),originalData:{name:m.name,notes:m.notes},parentId:p.id,parentType:'proje'}); });
    trashBin.push({id:nextTrashId++,type:'proje',name:p.name,parentName:'Genel',deletedAt:new Date().toISOString(),originalData:{name:p.name,modules:p.modules},parentId:null,parentType:null});
    projeler.splice(idx,1);
    if(aktifTip==='proje'&&aktifId===id){ if(projeler.length>0) SetActiveProje(projeler[0].id); else if(fikirler.length>0) SetActiveFikir(fikirler[0].id); else {aktifTip=null;aktifId=null;aktifModulId=null;activeTitleSpan.innerText='Ana Pano';moduleTabsContainer.innerHTML='';RenderBoard();} }
    RenderSidebar(); DebounceSave(); ShowToast('"'+p.name+'" projesi çöp kutusuna taşındı');
}

// ── MODÜL OPS ──
function AddNewModule() {

}
function SetActiveModul(mid) {

    if(isLineEditMode) DisableLineEditMode();
    RenderModuleTabs(); RenderBoard(); DebounceSave();
}
function DeleteModule(mid) {
    const proje=projeler.find(p=>p.id===aktifId); if(!proje) return;
    const idx=proje.modules.findIndex(m=>m.id===mid); if(idx===-1) return;

// ── NOTE OPS ──
function GetCurrentNotes() {
    if(aktifTip==='fikir'){ const f=fikirler.find(fk=>fk.id===aktifId); return f?f.notes:[]; }
    if(aktifTip==='proje'){ const p=projeler.find(pp=>pp.id===aktifId); if(!p||!aktifModulId) return []; const m=p.modules.find(mm=>mm.id===aktifModulId); return m?m.notes:[]; }
    return [];
}
function AddNoteToActive() {
    if(!aktifTip||!aktifId){ShowToast("Önce bir fikir veya proje seçin",1200);return;}
    if(aktifTip==='proje'&&!aktifModulId){ShowToast("Önce bir modül seçin",1200);return;}
    pushUndo();
    const {left,top}=GetRandomPosition();
    const note={id:nextNoteId++,title:"Yeni Not",blocks:[MakeBlock('text')],left,top,bgColor:"#1e293b"};
    const notes=GetCurrentNotes();
    if(notes===null){ShowToast("Hata: hedef bulunamadı",1200);return;}
    notes.push(note);
    RenderBoard(); RenderSidebar(); DebounceSave(); ShowToast("Not eklendi",800);
}
function DeleteNote(noteId, skipUndo=false) {
    if(!skipUndo) pushUndo();
    const notes=GetCurrentNotes();
    const idx=notes.findIndex(n=>n.id===noteId); if(idx===-1) return;
    const removed=notes.splice(idx,1)[0];
    let parentName='';
    if(aktifTip==='fikir'){ const f=fikirler.find(fk=>fk.id===aktifId); parentName=f?f.name:''; trashBin.push({id:nextTrashId++,type:'not',name:removed.title,parentName,deletedAt:new Date().toISOString(),originalData:removed,parentId:aktifId,parentType:'fikir'}); }
    else if(aktifTip==='proje'){ const p=projeler.find(pp=>pp.id===aktifId); const m=p?p.modules.find(mm=>mm.id===aktifModulId):null; parentName=p&&m?p.name+' / '+m.name:''; trashBin.push({id:nextTrashId++,type:'not',name:removed.title,parentName,deletedAt:new Date().toISOString(),originalData:removed,parentId:aktifId,parentType:'proje',modulId:aktifModulId}); }
    RemoveConnectionsForNote(noteId);
    RenderBoard(); RenderSidebar(); DebounceSave(); ShowToast("Not çöp kutusuna taşındı",800);
}

// ── RENDER SIDEBAR ──
function RenderSidebar() {
    fikirlerListDiv.innerHTML='';
    if(fikirler.length===0){ fikirlerListDiv.innerHTML='<div class="empty-message">Henüz fikir yok</div>'; }
    else fikirler.forEach(f=>{
        const div=document.createElement('div'); div.className='list-item';
        if(aktifTip==='fikir'&&aktifId===f.id) div.classList.add('active-item');
        const nameSpan=document.createElement('span'); nameSpan.className='item-name';
        nameSpan.innerHTML=`${EscapeHtml(f.name)}<span class="item-badge">${f.notes.length} not</span>`;
        const actions=document.createElement('div'); actions.className='item-actions';
        const convBtn=document.createElement('button'); convBtn.className='item-action-btn'; convBtn.title='Projeye dönüştür'; convBtn.innerHTML='→ Proje';
        convBtn.addEventListener('click',(e)=>{ e.stopPropagation(); ConvertFikirToProje(f.id); });
        const delBtn=document.createElement('button'); delBtn.className='item-action-btn danger'; delBtn.innerHTML='Sil';
        delBtn.addEventListener('click',(e)=>{ e.stopPropagation(); DeleteFikir(f.id); });
        actions.appendChild(convBtn); actions.appendChild(delBtn);
        div.appendChild(nameSpan); div.appendChild(actions);
        div.addEventListener('click',(e)=>{ if(!e.target.closest('.item-action-btn')) SetActiveFikir(f.id); });
        fikirlerListDiv.appendChild(div);
    });

    projelerListDiv.innerHTML='';
    if(projeler.length===0){ projelerListDiv.innerHTML='<div class="empty-message">Henüz proje yok</div>'; }
    else projeler.forEach(p=>{
        const div=document.createElement('div'); div.className='list-item';
        if(aktifTip==='proje'&&aktifId===p.id) div.classList.add('active-item');
        const toplamNot=p.modules.reduce((acc,m)=>acc+m.notes.length,0);
        const nameSpan=document.createElement('span'); nameSpan.className='item-name';
        nameSpan.innerHTML=`${EscapeHtml(p.name)}<span class="item-badge">${p.modules.length} modül · ${toplamNot} not</span>`;
        const actions=document.createElement('div'); actions.className='item-actions';
        const delBtn=document.createElement('button'); delBtn.className='item-action-btn danger'; delBtn.innerHTML='Sil';
        delBtn.addEventListener('click',(e)=>{ e.stopPropagation(); DeleteProje(p.id); });
        actions.appendChild(delBtn);
        div.appendChild(nameSpan); div.appendChild(actions);
        div.addEventListener('click',(e)=>{ if(!e.target.closest('.item-action-btn')) SetActiveProje(p.id); });
        projelerListDiv.appendChild(div);
    });
}

// ── RENDER MODULE TABS ──
function RenderModuleTabs() {
    moduleTabsContainer.innerHTML='';
    if(aktifTip!=='proje') return;
    const proje=projeler.find(p=>p.id===aktifId); if(!proje) return;
    proje.modules.forEach(m=>{
        const btn=document.createElement('button'); btn.className='module-tab';
        if(aktifModulId===m.id) btn.classList.add('active-tab');
        btn.innerHTML=`${EscapeHtml(m.name)}<button class="delete-module-btn" data-id="${m.id}">✕</button>`;
        btn.onclick=(e)=>{ if(!e.target.classList.contains('delete-module-btn')) SetActiveModul(m.id); };
        btn.querySelector('.delete-module-btn').addEventListener('click',(e)=>{ e.stopPropagation(); DeleteModule(m.id); });
        moduleTabsContainer.appendChild(btn);
    });
    const addBtn=document.createElement('button'); addBtn.className='add-module-btn'; addBtn.innerHTML='+ Modül ekle';
    addBtn.onclick=()=>AddNewModule();
    moduleTabsContainer.appendChild(addBtn);
}

// ── RENDER BOARD ──
function RenderBoard() {
    notesContainer.innerHTML='';
    if(!aktifTip||!aktifId){ notesContainer.innerHTML='<div style="color:#5a6e85;text-align:center;margin-top:80px;font-size:0.9rem;">Bir fikir veya proje seçin</div>'; return; }
    let notes=[];
    if(aktifTip==='fikir'){
        const f=fikirler.find(fk=>fk.id===aktifId);
        if(!f){notesContainer.innerHTML='<div style="color:#5a6e85;text-align:center;margin-top:80px;">Fikir bulunamadı</div>';return;}
        notes=f.notes;
    } else {
        const p=projeler.find(pp=>pp.id===aktifId);
        if(!p){notesContainer.innerHTML='<div style="color:#5a6e85;text-align:center;margin-top:80px;">Proje bulunamadı</div>';return;}
        if(!aktifModulId||!p.modules.find(m=>m.id===aktifModulId)){
            if(p.modules.length>0){aktifModulId=p.modules[0].id;RenderModuleTabs();}
            else{notesContainer.innerHTML='<div style="color:#5a6e85;text-align:center;margin-top:80px;">Modül eklemek için "+ Modül ekle"ye tıklayın</div>';return;}
        }
        const m=p.modules.find(mm=>mm.id===aktifModulId);
        notes=m.notes;
    }
    if(notes.length===0){ notesContainer.innerHTML='<div style="color:#5a6e85;text-align:center;margin-top:80px;font-size:0.85rem;">Not eklemek için "+ Not Ekle"ye tıklayın</div>'; return; }
    notes.forEach(note=>RenderNoteCard(note));
    setTimeout(()=>RenderLines(),50);
}

// ── TRASH ──
function ShowTrashModal() {
    const modal=document.createElement('div'); modal.className='modal-overlay';
    if(trashBin.length===0){
        modal.innerHTML=`<div class="modal-container"><h3>🗑 Çöp Kutusu</h3><div class="empty-trash">Çöp kutusu boş</div><div class="modal-buttons"><button class="modal-btn modal-btn-cancel" id="CM">Kapat</button></div></div>`;
        document.body.appendChild(modal); modal.querySelector('#CM').onclick=()=>modal.remove(); return;
    }
    modal.innerHTML=`<div class="modal-container" style="width:580px;"><h3>🗑 Çöp Kutusu</h3><div class="trash-list" id="TL"></div><div class="modal-buttons" style="justify-content:space-between;"><div style="display:flex;gap:6px;"><button class="modal-btn modal-btn-cancel" id="SABtn">Tümünü Seç</button></div><div style="display:flex;gap:7px;"><button class="modal-btn modal-btn-confirm" id="RBtn">Geri Yükle</button><button class="modal-btn modal-btn-danger" id="DBtn">Kalıcı Sil</button><button class="modal-btn modal-btn-cancel" id="CBtn">Kapat</button></div></div></div>`;
    document.body.appendChild(modal);
    const listDiv=modal.querySelector('#TL');
    let selected=new Array(trashBin.length).fill(false);
    const typeBadge=(type)=>{ const map={'fikir':['tb-fikir','💡 Fikir'],'proje':['tb-proje','📁 Proje'],'modul':['tb-modul','📂 Modül'],'not':['tb-not','📝 Not']}; const [cls,lbl]=map[type]||['tb-not',type]; return `<span class="trash-type-badge ${cls}">${lbl}</span>`; };
    const renderList=()=>{
        listDiv.innerHTML='';
        trashBin.forEach((item,idx)=>{
            const div=document.createElement('div'); div.className='trash-item'; if(selected[idx]) div.classList.add('selected');
            div.innerHTML=`<input type="checkbox" class="trash-checkbox" ${selected[idx]?'checked':''}><div class="trash-info"><div class="trash-name">${EscapeHtml(item.name)}</div><div class="trash-meta">${typeBadge(item.type)}<span>${EscapeHtml(item.parentName)}</span><span>${new Date(item.deletedAt).toLocaleDateString('tr-TR')}</span></div></div>`;
            const chk=div.querySelector('.trash-checkbox');
            chk.onchange=(e)=>{selected[idx]=e.target.checked; div.classList.toggle('selected',e.target.checked);};
            div.onclick=(e)=>{if(e.target!==chk){chk.checked=!chk.checked;selected[idx]=chk.checked;div.classList.toggle('selected',chk.checked);}};
            listDiv.appendChild(div);
        });
    };
    renderList();
    modal.querySelector('#SABtn').onclick=()=>{selected.fill(true);renderList();};
    modal.querySelector('#RBtn').onclick=()=>{
        const idxs=selected.map((v,i)=>v?i:-1).filter(i=>i!==-1);
        if(idxs.length===0){ShowToast("Lütfen öğe seçin",1000);return;}
        RestoreFromTrash(idxs); modal.remove(); ShowToast(idxs.length+" öğe geri yüklendi",1500);
    };
    modal.querySelector('#DBtn').onclick=()=>{
        const idxs=selected.map((v,i)=>v?i:-1).filter(i=>i!==-1).reverse();
        if(idxs.length===0){ShowToast("Lütfen öğe seçin",1000);return;}
        if(confirm(idxs.length+" öğeyi kalıcı olarak silmek istiyor musunuz?")){ idxs.forEach(i=>trashBin.splice(i,1)); DebounceSave(); modal.remove(); ShowToast(idxs.length+" öğe kalıcı silindi",1500); }
    };
    modal.querySelector('#CBtn').onclick=()=>modal.remove();
}

function RestoreFromTrash(indices) {
    for(let i of indices.sort((a,b)=>b-a)){
        const item=trashBin[i];
        if(item.type==='fikir'){ const f={id:nextFikirId++,name:item.name,notes:item.originalData?.notes||[]}; f.notes.forEach(n=>{if(n.id>=nextNoteId)nextNoteId=n.id+1;}); fikirler.push(f); }
        else if(item.type==='proje'){ const p={id:nextProjeId++,name:item.name,modules:item.originalData?.modules||[]}; p.modules.forEach(m=>{if(m.id>=nextModulId)nextModulId=m.id+1; m.notes.forEach(n=>{if(n.id>=nextNoteId)nextNoteId=n.id+1;})}); projeler.push(p); }
        else if(item.type==='modul'){ const p=projeler.find(pp=>pp.id===item.parentId); if(p){ const m={id:nextModulId++,name:item.name,notes:item.originalData?.notes||[]}; m.notes.forEach(n=>{if(n.id>=nextNoteId)nextNoteId=n.id+1;}); p.modules.push(m); } }
        else if(item.type==='not'){
            if(item.parentType==='fikir'){ const f=fikirler.find(ff=>ff.id===item.parentId); if(f&&item.originalData){ f.notes.push({...item.originalData,id:nextNoteId++}); } }
            else if(item.parentType==='proje'&&item.modulId){ const p=projeler.find(pp=>pp.id===item.parentId); if(p){ const m=p.modules.find(mm=>mm.id===item.modulId); if(m&&item.originalData) m.notes.push({...item.originalData,id:nextNoteId++}); } }
        }
        trashBin.splice(i,1);
    }
    RenderSidebar(); RenderModuleTabs(); RenderBoard(); DebounceSave();
}

// ── EVENTS ──
document.getElementById('AddFikirBtn').addEventListener('click', AddNewFikir);
document.getElementById('AddProjeBtn').addEventListener('click', AddNewProje);
document.getElementById('AddNoteToActiveBtn').addEventListener('click', AddNoteToActive);
document.getElementById('TrashBinBtn').addEventListener('click', ShowTrashModal);
document.getElementById('EnableLineEditBtn').addEventListener('click', EnableLineEditMode);
document.getElementById('UndoBtn').addEventListener('click', performUndo);
document.getElementById('SaveManualBtn').addEventListener('click', ()=>{ SaveToDB(); ShowToast("Kaydedildi ✓",1000); });

window.addEventListener('resize', ()=>{ RenderBoard(); setTimeout(()=>RenderLines(),100); });

// ── START ──
async function StartApp() {
    await InitDB();
    await LoadFromDB();
    RenderSidebar();
    RenderModuleTabs();
    RenderLineEditorBar();
    initSelection();
    if(aktifTip==='fikir'&&fikirler.find(f=>f.id===aktifId)) SetActiveFikir(aktifId);
    else if(aktifTip==='proje'&&projeler.find(p=>p.id===aktifId)) SetActiveProje(aktifId);
    else if(fikirler.length>0) SetActiveFikir(fikirler[0].id);
    else if(projeler.length>0) SetActiveProje(projeler[0].id);
    else RenderBoard();
}
StartApp();
</script>
